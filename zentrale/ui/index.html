<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRPG Zentrale</title>
<meta name="theme-color" content="#24272d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css">
<style>
  body { height: 100vh; height: 100dvh; display: grid; grid-template-rows: 52px 1fr 28px; overflow: hidden; }
  .top { display: flex; gap: 10px; align-items: center; padding: 8px 14px; background: var(--bg-deep); border-bottom: 1px solid var(--line); }
  .brand { color: var(--cyan); font: bold 16px var(--mono); cursor: pointer; white-space: nowrap; }
  main { min-height: 0; display: grid; grid-template-columns: 220px 1fr; }
  .side { background: var(--bg-deep); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .nav { padding: 8px; overflow: auto; flex: 1; }
  .nav .grp { padding: 12px 8px 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .nav button { width: 100%; display: flex; gap: 8px; padding: 8px; border: 0; background: transparent; color: var(--muted); text-align: left; font-family: var(--mono); cursor: pointer; border-radius: var(--radius); }
  .nav button .ic { width: 18px; text-align: center; }
  .nav button:hover, .nav button.active { background: var(--cyan-soft); color: var(--cyan); }
  .nav .hint { padding: 6px 8px; font-size: 12px; color: var(--muted); }
  .work { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--bg-deep); min-height: 37px; flex: none; }
  .tab { display: flex; gap: 8px; align-items: center; padding: 8px 12px; color: var(--muted); font-family: var(--mono); cursor: pointer; border-top: 2px solid transparent; white-space: nowrap; user-select: none; }
  .tab.active { color: var(--cyan); border-top-color: var(--cyan); background: var(--bg); }
  .tab .x { opacity: .5; padding: 0 2px; } .tab .x:hover { opacity: 1; color: var(--red); }
  .views { flex: 1; min-height: 0; position: relative; }
  .views iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  .views iframe.active { display: block; }
  .home { position: absolute; inset: 0; overflow: auto; display: none; }
  .home.active { display: block; }
  .home h1 { font: bold 22px var(--mono); color: var(--cyan); margin: 0 0 4px; }
  .home h2 { display: flex; align-items: center; gap: 8px; }
  .home h2 .btn { margin-left: auto; font: 12px var(--sans); }
  .tile { cursor: pointer; transition: border-color .15s; }
  .tile:hover { border-color: var(--cyan); }
  .tile .ic { font-size: 22px; color: var(--cyan); }
  .tile b { display: block; margin: 6px 0 4px; }
  .stat b { font: bold 22px var(--mono); color: var(--cyan); display: block; margin: 4px 0 8px; }
  .status { padding: 6px 12px; color: var(--muted); font: 11px var(--mono); border-top: 1px solid var(--line); background: var(--bg-deep); display: flex; gap: 16px; white-space: nowrap; overflow: hidden; }
  .status .grow { flex: 1; }
  /* Toasts */
  .toasts { position: fixed; right: 14px; bottom: 40px; display: flex; flex-direction: column; gap: 8px; z-index: 20; max-width: min(380px, calc(100vw - 28px)); }
  .toast { background: var(--bg-deep); border: 1px solid var(--line); border-left: 3px solid var(--cyan); border-radius: var(--radius); padding: 10px 12px; box-shadow: 0 6px 20px #0006; animation: tin .2s ease-out; cursor: pointer; }
  .toast.ok { border-left-color: var(--green); } .toast.warn { border-left-color: var(--yellow); } .toast.err { border-left-color: var(--red); }
  @keyframes tin { from { transform: translateY(8px); opacity: 0; } }
  /* Befehlspalette */
  .palette { position: fixed; inset: 0; background: #0008; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 30; }
  .palette.open { display: flex; }
  .palette .box { width: min(560px, 92vw); }
  .palette input { width: 100%; }
  .palette ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
  .palette li { padding: 8px 10px; border-radius: var(--radius); cursor: pointer; font-family: var(--mono); }
  .palette li.sel, .palette li:hover { background: var(--cyan-soft); color: var(--cyan); }
  .hide-sm { }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .side { display: none; }
    .side.mobile { display: flex; position: fixed; inset: 52px 0 28px; z-index: 15; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <button class="btn" id="sideBtn" title="Menü">☰</button>
  <div class="brand" id="brand">〄 MRPG Zentrale</div>
  <div class="grow"></div>
  <button class="btn" id="palBtn">⌘ <span class="hide-sm">Befehle <span class="muted mono">Strg+K</span></span></button>
  <button class="btn" id="logoutBtn" title="Abmelden">⏻</button>
</header>
<main>
  <aside class="side" id="side"><nav class="nav" id="nav"></nav></aside>
  <section class="work">
    <div class="tabs" id="tabs"></div>
    <div class="views" id="views">
      <div class="home active" id="home"><div class="page">
        <h1>〄 MRPG Zentrale</h1>
        <div class="muted" id="greet">Alle Projekte, Apps und KI-Modelle an einem Ort.</div>

        <h2>System</h2>
        <div class="grid" id="sys"></div>

        <h2>Zuletzt bearbeitete Projekte <button class="btn" data-open="projekte">Alle Projekte →</button></h2>
        <div class="grid" id="proj"></div>

        <h2>KI-Modelle <button class="btn" data-open="ki-konten">Konten &amp; Nutzung →</button></h2>
        <div class="grid" id="ki"></div>

        <h2>Laufende Prozesse <button class="btn" data-open="prozesse">Prozesse →</button></h2>
        <div id="procs"></div>

        <h2>Werkzeuge</h2>
        <div class="grid" id="tiles"></div>
      </div></div>
    </div>
  </section>
</main>
<footer class="status"><span id="stInfo">…</span><span id="stKi" class="hide-sm"></span><span class="grow"></span><span id="stEvt" class="hide-sm"></span></footer>

<div class="toasts" id="toasts"></div>
<div class="palette" id="palette"><div class="box card">
  <input class="input" id="palIn" placeholder="Modul, Projekt oder Befehl suchen …" autocomplete="off">
  <ul id="palList"></ul>
</div></div>

<script src="/zentrale-sdk.js"></script>
<script src="/app.js"></script>
</body>
</html>
