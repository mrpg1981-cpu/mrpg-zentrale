<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRPG Central</title><style>:root{--bg:#2b2f36;--panel:#383c44;--line:#59616d;--cyan:#67f5ff;--text:#f2f5f7}*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--text);font:14px system-ui;display:grid;grid-template-rows:52px 1fr 28px}.top{display:flex;gap:10px;align-items:center;padding:8px 14px;background:#24272d;border-bottom:1px solid var(--line)}.brand{color:var(--cyan);font:bold 16px monospace}.spacer{flex:1}.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}.primary{background:var(--cyan);color:#111}main{min-height:0;display:grid;grid-template-columns:220px 1fr 42%}.side,.editor,.right{min-width:0;min-height:0;background:#24272d;border-right:1px solid var(--line)}.side{display:flex;flex-direction:column}.head{padding:12px;color:#b9bec7;border-bottom:1px solid var(--line)}.files{padding:8px;overflow:auto}.file,.tab{width:100%;padding:8px;border:0;background:transparent;color:#b9bec7;text-align:left;font-family:monospace;cursor:pointer}.file.active,.file:hover,.tab.active{background:#67f5ff22;color:var(--cyan)}.sidefoot{margin-top:auto;padding:9px;border-top:1px solid var(--line);display:grid;gap:7px}.editor{display:flex;flex-direction:column}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--line)}.tab{width:auto;border-top:2px solid transparent}#code{flex:1;width:100%;resize:none;border:0;outline:0;background:#292d34;color:var(--text);padding:16px;font:14px/1.5 Consolas,monospace}.meta,.status{padding:6px 10px;color:#b9bec7;font:11px monospace;border-top:1px solid var(--line)}.right{display:flex;flex-direction:column}.rtabs{display:flex;border-bottom:1px solid var(--line)}.rtabs button{flex:1;background:transparent;color:#b9bec7;border:0;padding:10px}.rtabs button.active{color:var(--cyan);border-bottom:2px solid var(--cyan)}.view{display:none;flex:1;min-height:0}.view.active{display:flex;flex-direction:column}.tools{display:flex;gap:6px;padding:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.previewbox{flex:1;min-height:0;display:flex;background:#4b515a;justify-content:center;overflow:auto}iframe{width:100%;height:100%;border:0;background:#fff}#terminal{flex:1;overflow:auto;background:#171a1f;color:#3fb950;padding:12px;font:12px monospace;white-space:pre-wrap}.termline{display:flex;gap:8px;padding:9px;background:#24272d;border-top:1px solid var(--line)}#term{flex:1;background:transparent;color:var(--text);border:0;outline:0;font:13px monospace}.metric{padding:12px;margin:12px;border:1px solid var(--line)}.metric b{color:var(--cyan)}@media(max-width:900px){main{grid-template-columns:1fr 1fr}.side{display:none}}@media(max-width:650px){main{grid-template-columns:1fr}.right{display:none}.right.mobile{display:flex;position:fixed;inset:52px 0 28px;z-index:5}}</style></head><body><header class="top"><button class="btn" id="sideBtn">☰</button><div class="brand">〄 MRPG Central</div><div class="spacer"></div><button class="btn" id="termBtn">⌨ Terminal</button><button class="btn primary" id="dlBtn">⬇ HTML speichern</button></header><main><aside class="side" id="side"><div class="head">Projekt-Dateien</div><div class="files" id="files"></div></aside><section class="editor"><div class="tabs" id="tabs"></div><textarea id="code" spellcheck="false"></textarea><div class="meta"><span id="active"></span> · <span id="stats"></span></div></section><section class="right" id="right"><nav class="rtabs"><button class="active" data-view="previewView">Preview</button><button data-view="consoleView">Console</button><button data-view="blueprintView">Blueprint</button></nav><section class="view active" id="previewView"><div class="tools"><button class="btn" id="refresh">⟳</button><button class="btn" data-width="100%">Desktop</button><button class="btn" data-width="768px">Tablet</button><button class="btn" data-width="390px">Mobile</button></div><div class="previewbox"><iframe id="frame" sandbox="allow-scripts"></iframe></div></section><section class="view" id="consoleView"><div id="console">Console bereit</div></section><section class="view" id="blueprintView"><div class="metric"><b>MRPG Central</b><br>Local-first Control Room<br><span id="bp"></span></div></section></section></main><section id="terminal" style="display:none"><div id="termOut">MRPG Terminal · help für Befehle\n</div><div class="termline"><span>mrpg@central:~$</span><input id="term"></div></section><footer class="status">READY · LOCAL-FIRST · mrpg-central.html</footer><script>(()=>{const $=id=>document.getElementById(id),KEY='mrpg-central-project',DEF='<!doctype html><html lang="de"><head><meta charset="utf-8"><title>MRPG Central</title><style>body{font-family:system-ui;background:#f4f6f8;padding:48px}.card{max-width:600px;margin:auto;background:white;padding:32px;border:2px solid #00b8cc;border-radius:12px}button{padding:10px 16px;background:#00b8cc;color:white;border:0;border-radius:6px}</style></head><body><main class="card"><h1>MRPG Central</h1><p>Bearbeite den Code links.</p><button>MRPG OK</button></main></body></html>',files=JSON.parse(localStorage.getItem(KEY)||'null')||{'index.html':DEF},active='index.html';function save(){localStorage.setItem(KEY,JSON.stringify(files))}function render(){$('files').innerHTML=Object.keys(files).map(x=>'<button class="file '+(x===active?'active':'')+'" data-file="'+x+'">'+x+'</button>').join('');$('tabs').innerHTML=Object.keys(files).map(x=>'<button class="tab '+(x===active?'active':'')+'" data-file="'+x+'">'+x+'</button>').join('');$('bp').textContent=' · Dateien: '+Object.keys(files).length}function openFile(n){if(!(n in files))return;active=n;$('code').value=files[n];render();meta();preview()}function meta(){$('active').textContent=active;$('stats').textContent=$('code').value.split('\n').length+' Zeilen · '+$('code').value.length+' Zeichen'}function preview(){$('frame').srcdoc=files['index.html']||$('code').value}function download(n,c){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/html'}));a.download=n;a.click()}$('code').oninput=()=>{files[active]=$('code').value;save();meta();preview()};document.onclick=e=>{if(e.target.dataset.file)openFile(e.target.dataset.file);if(e.target.dataset.view){document.querySelectorAll('.rtabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===e.target.dataset.view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===e.target.dataset.view))}};$('dlBtn').onclick=()=>download(active,files[active]);$('refresh').onclick=preview;document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>$('frame').style.width=b.dataset.width);$('sideBtn').onclick=()=>$('side').classList.toggle('hidden');$('termBtn').onclick=()=>{$('terminal').style.display=$('terminal').style.display==='none'?'flex':'none';$('term').focus()};$('term').onkeydown=e=>{if(e.key!=='Enter')return;const l=e.target.value.trim();$('termOut').textContent+='mrpg@central:~$ '+l+'\n';if(l==='help')$('termOut').textContent+='help, ls, open, save, download, preview, clear\n';else if(l==='ls')$('termOut').textContent+=Object.keys(files).join('\n')+'\n';else if(l==='save')save();else if(l==='download')download(active,files[active]);else if(l==='preview')preview();else if(l==='clear')$('termOut').textContent='';else $('termOut').textContent+='Unbekannter Befehl – help\n';e.target.value=''};render();openFile(active)})()</script></body></html>
