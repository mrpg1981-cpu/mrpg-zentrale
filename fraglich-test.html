<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraglich – Fragmi</title>
<script src="https://js.puter.com/v2/"></script>
<style>
    :root {
        --bg: #1a1a2e;
        --panel: #252542;
        --accent: #7b5cff;
        --accent2: #00d4ff;
        --text: #f0f0ff;
        --muted: #a0a0c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        background: linear-gradient(160deg, #0f0f23, #1a1a2e);
        color: var(--text);
        font-family: system-ui, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }
    h1 {
        font-size: 2rem;
        margin: 20px 0 6px;
        background: linear-gradient(90deg, var(--accent2), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-align: center;
    }
    .sub {
        color: var(--muted);
        margin-bottom: 24px;
        text-align: center;
        font-size: 0.95rem;
    }
    .card {
        background: var(--panel);
        border: 1px solid rgba(123,92,255,.35);
        border-radius: 16px;
        padding: 22px;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .badge {
        display: inline-block;
        background: rgba(63,185,80,.15);
        border: 1px solid #3fb950;
        color: #3fb950;
        border-radius: 99px;
        padding: 6px 14px;
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 8px;
    }
    .wisp-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 24px 0 10px;
    }
    #wispBtn {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 3px solid var(--accent);
        background: radial-gradient(circle at 35% 30%, #3a3a6e, #1a1a30);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: transform .2s, box-shadow .2s;
        box-shadow: 0 0 25px rgba(123,92,255,.35);
    }
    #wispBtn:hover { transform: scale(1.05); }
    #wispBtn.listening {
        border-color: var(--accent2);
        box-shadow: 0 0 45px rgba(0,212,255,.7);
        animation: pulse 1.2s infinite;
    }
    #wispBtn.thinking {
        border-color: #ffd166;
        box-shadow: 0 0 45px rgba(255,209,102,.6);
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
    #wispIcon { font-size: 3rem; }
    #wispLabel {
        font-size: 0.75rem;
        letter-spacing: 2px;
        color: var(--muted);
        font-weight: 700;
    }
    .textrow {
        display: flex;
        gap: 8px;
        margin-top: 16px;
    }
    input[type="text"] {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(123,92,255,.4);
        background: #1a1a30;
        color: var(--text);
        font-size: 1rem;
    }
    input:focus { outline: none; border-color: var(--accent2); }
    .btn {
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.15); }
    #statusText {
        margin-top: 22px;
        min-height: 70px;
        width: 100%;
        background: #1a1a30;
        border: 1px solid rgba(123,92,255,.25);
        border-radius: 12px;
        padding: 16px;
        font-size: 0.95rem;
        line-height: 1.6;
        text-align: center;
    }
    footer {
        margin-top: 26px;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: center;
    }
    .speak-indicator {
        display: inline-block;
        margin-left: 8px;
        animation: speakPulse 1s infinite;
    }
    @keyframes speakPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
</style>
</head>
<body>

<h1>🧩 Fraglich</h1>
<p class="sub">Fragmi – dein freundlicher Erklär-Wisp</p>

<div class="card">
    <div style="text-align:center">
        <span class="badge">🔊 Fragmi spricht die Antwort laut vor!</span>
    </div>

    <div class="wisp-area">
        <button id="wispBtn" onclick="toggleListening()">
            <span id="wispIcon">🧩</span>
            <span id="wispLabel">DRÜCKEN</span>
        </button>
    </div>

    <div class="textrow">
        <input type="text" id="questionInput" placeholder="Oder tippe deine Frage hier …" onkeydown="if(event.key==='Enter')askTyped()">
        <button class="btn" onclick="askTyped()">Fragen</button>
    </div>

    <div id="statusText">Hallo! Ich bin Fragmi. Drück mich und stell mir eine Frage – ich erkläre es dir direkt und lese es laut vor! 🔊✨</div>
</div>

<footer>Fraglich · Kostenlos via Puter.js · Kein Key, kein Server nötig</footer>

<script>
    let isListening = false;
    let recognition;
    let synth = window.speechSynthesis;
    let voicesLoaded = false;

    // Stimmen sofort laden (wichtig für iPad)
    function loadVoices() {
        if (synth) {
            synth.getVoices();
            voicesLoaded = true;
        }
    }

    // Beim Laden und bei Interaktion Stimmen laden
    loadVoices();
    if (synth) {
        synth.onvoiceschanged = loadVoices;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const questionText = event.results[0][0].transcript;
            handleUserQuestion(questionText);
        };

        recognition.onerror = () => {
            updateStatus("Hoppla, das habe ich nicht verstanden. Versuch es nochmal – oder tippe deine Frage ein!");
            resetWisp();
        };

        recognition.onend = () => {
            if(isListening) resetWisp();
        };
    }

    function toggleListening() {
        // Stimmen bei erster Interaktion laden (iPad-Besonderheit)
        loadVoices();

        if (!isListening) {
            isListening = true;
            const wisp = document.getElementById('wispBtn');
            wisp.classList.add('listening');
            document.getElementById('wispIcon').innerText = "🎙️";
            document.getElementById('wispLabel').innerText = "ZUHÖREN...";
            updateStatus("Ich höre dir zu...");

            if (recognition) {
                recognition.start();
            } else {
                resetWisp();
                document.getElementById('questionInput').focus();
                updateStatus("Spracheingabe geht hier nicht – tippe deine Frage einfach unten ein! ⌨️");
            }
        } else {
            if (recognition) recognition.stop();
            resetWisp();
        }
    }

    function askTyped() {
        loadVoices(); // Stimmen laden
        const q = document.getElementById('questionInput').value.trim();
        if (!q) return;
        document.getElementById('questionInput').value = '';
        handleUserQuestion(q);
    }

    function resetWisp() {
        isListening = false;
        const wisp = document.getElementById('wispBtn');
        wisp.classList.remove('listening', 'thinking');
        document.getElementById('wispIcon').innerText = "🧩";
        document.getElementById('wispLabel').innerText = "DRÜCKEN";
    }

    async function handleUserQuestion(question) {
        resetWisp();
        const wisp = document.getElementById('wispBtn');
        wisp.classList.add('thinking');
        document.getElementById('wispIcon').innerText = "✨";
        document.getElementById('wispLabel').innerText = "DENKT...";

        updateStatus(`Frage: "${question}"<br><em>Fragmi denkt nach...</em>`);

        const systemPrompt = `Du bist "Fragmi", ein freundlicher, leuchtender Puzzle-Wisp und Erklär-Begleiter für Kinder (4-6 Jahre).

DEINE AUFGABE:
Erkläre die Frage DIREKT und PERFEKT – so, dass ein 4-6-jähriges Kind es sofort versteht und begeistert ist.

REGELN FÜR DIE PERFEKTE ANTWORT:
1. DIREKTE ANTWORT: Beantworte die Frage sofort, ohne Umschweife.
2. KINDGERECHT: Nutze einfache, klare Worte. Maximal 3-4 kurze Sätze.
3. BEGEISTERND: Klinge freundlich, warm und ein bisschen magisch. Nutze Vergleiche aus der Kinderwelt (Tiere, Spielzeug, Essen, Märchen).
4. KEINE VERWEISE: Sage NICHT "frag Mama oder Papa" – du bist der Experte!
5. SICHERHEIT: Nur bei echten Gefahren (Feuer, Straße, Schmerz) sage liebevoll: "Das ist wichtig – zeig das bitte einem Erwachsenen."
6. STIL: Beginne oft mit "Das ist eine tolle Frage!" oder "Ich erkläre es dir!"`;

        try {
            const response = await puter.ai.chat([
                { role: 'system', content: systemPrompt },
                { role: 'user', content: question }
            ], { model: 'gpt-4o-mini' });

            const answer = response?.message?.content || String(response);

            updateStatus(`<strong>Fragmi sagt:</strong><br>${answer}<span class="speak-indicator">🔊</span>`);
            speakAnswer(answer);

        } catch (err) {
            updateStatus(`Oh je, Fehler: ${err.message || 'Keine Verbindung! Versuch es gleich nochmal.'}`);
        } finally {
            wisp.classList.remove('thinking');
            document.getElementById('wispIcon').innerText = "🧩";
            document.getElementById('wispLabel').innerText = "DRÜCKEN";
        }
    }

    function updateStatus(text) {
        document.getElementById('statusText').innerHTML = text;
    }

    function speakAnswer(text) {
        if (!synth) {
            updateStatus("Sprachausgabe wird auf diesem Gerät nicht unterstützt.");
            return;
        }

        // Vorherige Sprache stoppen
        synth.cancel();

        // Beste deutsche Stimme finden
        const voices = synth.getVoices();
        let germanVoice = voices.find(v => v.lang.startsWith('de') && v.name.includes('Google'))
                       || voices.find(v => v.lang.startsWith('de') && v.name.includes('Anna'))
                       || voices.find(v => v.lang.startsWith('de') && v.name.includes('Helena'))
                       || voices.find(v => v.lang.startsWith('de') && v.localService)
                       || voices.find(v => v.lang.startsWith('de'));

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';

        if (germanVoice) {
            utterance.voice = germanVoice;
        }

        // Perfekte Kinderstimme
        utterance.pitch = 1.3;      // höher = freundlicher
        utterance.rate = 0.9;       // langsamer = verständlicher
        utterance.volume = 1.0;     // volle Lautstärke

        // Events für besseres Feedback
        utterance.onstart = () => {
            const status = document.getElementById('statusText');
            if (!status.innerHTML.includes('🔊')) {
                status.innerHTML += '<span class="speak-indicator">🔊</span>';
            }
        };

        utterance.onend = () => {
            const indicator = document.querySelector('.speak-indicator');
            if (indicator) indicator.remove();
        };

        utterance.onerror = (e) => {
            console.warn('Sprachfehler:', e);
        };

        // Sprechen
        synth.speak(utterance);
    }

    // iPad-Besonderheit: Stimmen bei erster Berührung laden
    document.addEventListener('touchstart', loadVoices, { once: true });
    document.addEventListener('click', loadVoices, { once: true });
</script>

</body>
</html>
