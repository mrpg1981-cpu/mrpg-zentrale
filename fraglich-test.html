<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragmi – Ihre digitale Wissens-Wisp</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1120">
<script src="https://js.puter.com/v2/"></script>
<style>
    :root {
        --bg: #0b1120;
        --panel: rgba(30, 41, 59, 0.7);
        --accent-teal: #38bdf8;
        --accent-orange: #f97316;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        background: var(--bg);
        background-image:
            radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.15), transparent 45%),
            radial-gradient(circle at 50% 80%, rgba(15, 23, 42, 0.8), transparent 50%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background: var(--panel);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        border-radius: 32px;
        padding: 32px 24px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                    0 0 2px rgba(255, 255, 255, 0.2) inset;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .logo-title {
        font-size: 2.4rem;
        font-weight: 900;
        letter-spacing: 3px;
        margin-bottom: 2px;
        display: flex;
    }
    .logo-title .blue { color: #38bdf8; }
    .logo-title .orange { color: #f97316; }

    .sub {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 20px;
    }

    .wisp-stage {
        position: relative;
        width: 230px;
        height: 230px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        margin: 10px 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .wisp-avatar {
        width: 190px;
        height: 190px;
        filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.45));
        transition: filter 0.4s ease;
        animation: floatWisp 4s ease-in-out infinite alternate;
    }

    @keyframes floatWisp {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
    }

    .wisp-stage.listening .wisp-avatar {
        filter: drop-shadow(0 0 40px rgba(249, 115, 22, 0.85));
        animation: listenPulse 1s ease-in-out infinite alternate;
    }

    .wisp-stage.thinking .wisp-avatar {
        filter: drop-shadow(0 0 40px rgba(168, 85, 247, 0.85));
        animation: thinkSpin 2.5s linear infinite;
    }

    .wisp-stage.speaking .wisp-avatar {
        filter: drop-shadow(0 0 40px rgba(56, 189, 248, 0.9));
        animation: speakBounce 0.55s ease-in-out infinite alternate;
    }

    @keyframes listenPulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.07); }
    }

    @keyframes thinkSpin {
        0% { transform: rotate(0deg) scale(0.97); }
        100% { transform: rotate(360deg) scale(0.97); }
    }

    @keyframes speakBounce {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-8px) scale(1.04); }
    }

    .eye { transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.08); }
    }

    .mouth { transition: all 0.2s; }
    .wisp-stage.speaking .mouth {
        animation: talk 0.3s ease-in-out infinite alternate;
    }
    @keyframes talk {
        0% { transform: scaleY(1); }
        100% { transform: scaleY(1.8); }
    }

    .wisp-label {
        margin-top: 8px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
    }

    .input-group {
        width: 100%;
        display: flex;
        gap: 8px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 6px 6px 6px 14px;
        margin-top: 10px;
    }

    input[type="text"] {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
    }

    input[type="text"]::placeholder { color: #475569; }

    .btn-send {
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        color: #fff;
        border: none;
        border-radius: 12px;
        width: 38px;
        height: 38px;
        cursor: pointer;
        font-weight: 700;
    }

    .btn-test {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
    }

    #statusText {
        margin-top: 18px;
        width: 100%;
        min-height: 75px;
        color: #cbd5e1;
        font-size: 0.95rem;
        line-height: 1.6;
        text-align: center;
    }

    footer {
        margin-top: 24px;
        color: #475569;
        font-size: 0.75rem;
        text-align: center;
    }
</style>
</head>
<body>

<div class="card">
    <div class="logo-title"><span class="blue">FRAG</span><span class="orange">MI</span></div>
    <p class="sub">Ihre digitale Wissens-Wisp</p>

    <button class="btn-test" onclick="unlockAndTestSafari()">🔊 Safari Stimme aktivieren</button>

    <div class="wisp-stage" id="wispBtn" onclick="toggleListening()">
        <svg class="wisp-avatar" viewBox="0 0 220 230" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="ballBody" cx="38%" cy="32%" r="70%">
                    <stop offset="0%" stop-color="#7dd3fc" />
                    <stop offset="45%" stop-color="#0ea5e9" />
                    <stop offset="100%" stop-color="#075985" />
                </radialGradient>
                <radialGradient id="eyeWhite" cx="50%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#e0f2fe" />
                </radialGradient>
                <radialGradient id="iris" cx="50%" cy="45%" r="55%">
                    <stop offset="0%" stop-color="#7dd3fc" />
                    <stop offset="60%" stop-color="#0284c7" />
                    <stop offset="100%" stop-color="#0c4a6e" />
                </radialGradient>
            </defs>

            <circle cx="110" cy="110" r="88" fill="url(#ballBody)" />

            <path d="M110 22 C110 60, 100 80, 110 110 C120 140, 110 160, 110 198" stroke="rgba(255,255,255,0.28)" stroke-width="2.5" fill="none"/>
            <path d="M22 110 C55 100, 80 118, 110 110 C140 102, 165 118, 198 110" stroke="rgba(255,255,255,0.28)" stroke-width="2.5" fill="none"/>
            <path d="M48 52 C75 70, 90 65, 110 110" stroke="rgba(255,255,255,0.22)" stroke-width="2" fill="none"/>
            <path d="M172 52 C145 70, 130 65, 110 110" stroke="rgba(255,255,255,0.22)" stroke-width="2" fill="none"/>
            <path d="M48 168 C75 150, 90 155, 110 110" stroke="rgba(255,255,255,0.22)" stroke-width="2" fill="none"/>
            <path d="M172 168 C145 150, 130 155, 110 110" stroke="rgba(255,255,255,0.22)" stroke-width="2" fill="none"/>

            <circle cx="110" cy="66" r="7" fill="rgba(255,255,255,0.18)" />
            <circle cx="66" cy="110" r="7" fill="rgba(255,255,255,0.18)" />
            <circle cx="154" cy="110" r="7" fill="rgba(255,255,255,0.18)" />
            <circle cx="110" cy="154" r="7" fill="rgba(255,255,255,0.18)" />

            <circle cx="35" cy="185" r="3" fill="#7dd3fc" opacity="0.8" />
            <circle cx="50" cy="200" r="2" fill="#7dd3fc" opacity="0.5" />
            <circle cx="185" cy="185" r="3" fill="#7dd3fc" opacity="0.8" />
            <circle cx="170" cy="202" r="2" fill="#7dd3fc" opacity="0.5" />
            <circle cx="110" cy="215" r="2.5" fill="#7dd3fc" opacity="0.6" />

            <g class="eye">
                <circle cx="80" cy="95" r="21" fill="url(#eyeWhite)" />
                <circle cx="80" cy="95" r="13" fill="url(#iris)" />
                <circle cx="80" cy="95" r="7" fill="#082f49" />
                <circle cx="75" cy="89" r="4.5" fill="#ffffff" />
                <circle cx="85" cy="100" r="2" fill="#ffffff" opacity="0.9" />
            </g>
            <g class="eye">
                <circle cx="140" cy="95" r="21" fill="url(#eyeWhite)" />
                <circle cx="140" cy="95" r="13" fill="url(#iris)" />
                <circle cx="140" cy="95" r="7" fill="#082f49" />
                <circle cx="135" cy="89" r="4.5" fill="#ffffff" />
                <circle cx="145" cy="100" r="2" fill="#ffffff" opacity="0.9" />
            </g>

            <ellipse cx="58" cy="122" rx="10" ry="6" fill="#fb7185" opacity="0.45" />
            <ellipse cx="162" cy="122" rx="10" ry="6" fill="#fb7185" opacity="0.45" />

            <g class="mouth" style="transform-origin: 110px 132px;">
                <path d="M96 130 Q110 141 124 130" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
            </g>
        </svg>
        <div class="wisp-label" id="wispLabel">Drücken zum Sprechen</div>
    </div>

    <div class="input-group">
        <input type="text" id="questionInput" placeholder="Oder Frage eintippen …" onkeydown="if(event.key==='Enter')askTyped()">
        <button class="btn-send" onclick="askTyped()">↑</button>
    </div>

    <div id="statusText">Tippe oben zuerst auf <strong>"Safari Stimme aktivieren"</strong>! 🧩✨</div>
</div>

<footer>FRAGMI · Offizielles Logo Vorschlag A · Puter.js KI</footer>

<script>
    let isListening = false;
    let recognition;
    let synth = window.speechSynthesis;
    let isSpeaking = false;
    let childName = localStorage.getItem('fragmi_childname') || null;

    function forceUnlockSafari() {
        if (!synth) return;
        synth.resume();
        const silent = new SpeechSynthesisUtterance(" ");
        silent.volume = 0.01;
        silent.lang = 'de-DE';
        synth.speak(silent);
    }

    function getGermanVoice() {
        if (!synth) return null;
        const voices = synth.getVoices().filter(v => v.lang.startsWith('de'));
        let voice = voices.find(v => v.name.includes('Siri') && v.name.includes('2'))
                 || voices.find(v => v.name.includes('Siri'));
        if (!voice) voice = voices.find(v => v.name.includes('Enhanced') || v.name.includes('Premium'));
        if (!voice) voice = voices.find(v => v.name.includes('Anna'))
                 || voices.find(v => v.name.includes('Helena'))
                 || voices.find(v => v.name.includes('Petra'))
                 || voices.find(v => v.name.includes('Google'));
        if (!voice) voice = voices.find(v => v.localService) || voices[0];
        return voice;
    }

    function applyChildVoice(utterance, variation = 0) {
        const v = getGermanVoice();
        if (v) utterance.voice = v;
        utterance.lang = 'de-DE';
        utterance.pitch = 1.55 + variation;
        utterance.rate = 0.95;
        utterance.volume = 1.0;
    }

    function unlockAndTestSafari() {
        forceUnlockSafari();
        setTimeout(() => {
            synth.cancel();
            // Persönliche Begrüßung: mit Name, oder nach Name fragen
            let greeting;
            if (childName) {
                greeting = `Hallo ${childName}! Schön, dass du wieder da bist! Ich bin Fragmi, dein Puzzle-Wisp. Was möchtest du heute wissen?`;
            } else {
                greeting = "Hallo! Ich bin Fragmi, dein kleiner Puzzle-Wisp! Wie heißt du denn?";
            }
            const u = new SpeechSynthesisUtterance(greeting);
            applyChildVoice(u);
            synth.speak(u);
            updateStatus(childName
                ? `🔊 Hallo ${childName}! Fragmi ist bereit für deine Fragen!`
                : "🔊 Fragmi möchte dich kennenlernen! Sag oder tippe deinen Namen.");
        }, 100);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const questionText = event.results[0][0].transcript;
            handleUserQuestion(questionText);
        };

        recognition.onerror = () => {
            updateStatus("Ich konnte dich nicht verstehen. Versuche es nochmal oder tippe unten!");
            resetWisp();
        };

        recognition.onend = () => {
            if(isListening) resetWisp();
        };
    }

    function toggleListening() {
        forceUnlockSafari();

        if (isSpeaking) {
            synth.cancel();
            isSpeaking = false;
            resetWisp();
            updateStatus("Vorlesen gestoppt.");
            return;
        }

        if (!isListening) {
            isListening = true;
            const container = document.getElementById('wispBtn');
            container.className = "wisp-stage listening";
            document.getElementById('wispLabel').innerText = "Höre zu...";
            updateStatus("Ich höre dir zu...");

            if (recognition) {
                try { recognition.start(); } catch(e) { resetWisp(); }
            } else {
                resetWisp();
                document.getElementById('questionInput').focus();
                updateStatus("Spracheingabe hier nicht unterstützt – bitte eintippen!");
            }
        } else {
            if (recognition) recognition.stop();
            resetWisp();
        }
    }

    function askTyped() {
        forceUnlockSafari();
        const q = document.getElementById('questionInput').value.trim();
        if (!q) return;
        document.getElementById('questionInput').value = '';
        handleUserQuestion(q);
    }

    function resetWisp() {
        isListening = false;
        const container = document.getElementById('wispBtn');
        container.className = "wisp-stage";
        document.getElementById('wispLabel').innerText = "Drücken zum Sprechen";
    }

    // Begrüßung erkennen (Hallo, Hi, Hey, Guten Tag, ...)
    function isGreeting(text) {
        const greetings = ['hallo', 'hi', 'hey', 'guten tag', 'guten morgen', 'guten abend', 'servus', 'moin', 'na', 'huhu', 'halo'];
        const lower = text.toLowerCase().trim();
        return greetings.some(g => lower.startsWith(g)) && lower.length < 30;
    }

    // Name aus Antwort extrahieren (z.B. "Ich heiße Ben" → "Ben")
    function extractName(text) {
        const patterns = [
            /ich hei(?:s|ß)e?\s+([a-zäöü]+)/i,
            /mein name ist\s+([a-zäöü]+)/i,
            /ich bin\s+([a-zäöü]+)/i,
            /^([a-zäöü]+)$/i  // nur ein Wort = wahrscheinlich der Name
        ];
        for (const p of patterns) {
            const m = text.trim().match(p);
            if (m) {
                const name = m[1].toLowerCase();
                // keine Begrüßungen oder Füllwörter als Name akzeptieren
                const blocked = ['hallo', 'hi', 'hey', 'gut', 'danke', 'bitte', 'ja', 'nein', 'okay', 'fragmi'];
                if (!blocked.includes(name) && name.length > 1 && name.length < 20) {
                    return name.charAt(0).toUpperCase() + name.slice(1);
                }
            }
        }
        return null;
    }

    async function handleUserQuestion(question) {
        resetWisp();
        const container = document.getElementById('wispBtn');
        container.className = "wisp-stage thinking";
        document.getElementById('wispLabel').innerText = "Denkt nach...";
        updateStatus(`<em>Fragmi denkt nach...</em>`);

        if (synth) {
            synth.resume();
            const dummy = new SpeechSynthesisUtterance("");
            synth.speak(dummy);
        }

        // 1. Name extrahieren? (wenn Kind seinen Namen sagt)
        const possibleName = extractName(question);
        if (possibleName && !childName) {
            childName = possibleName;
            localStorage.setItem('fragmi_childname', childName);
            const answer = `Hallo ${childName}! Was für ein schöner Name! Schön, dass du da bist, ${childName}! Hast du eine Frage an mich? Ich erkläre dir alles, was du wissen möchtest!`;
            updateStatus(answer);
            speakAnswerSafari(answer);
            return;
        }

        // 2. Begrüßung? → Freundlich zurückgrüßen (UND nach Name fragen falls unbekannt)
        if (isGreeting(question)) {
            let answer;
            if (childName) {
                answer = `Hallo ${childName}! Schön, dich zu sehen! Was möchtest du heute wissen? Stell mir einfach eine Frage!`;
            } else {
                answer = "Hallo! Schön, dass du da bist! Wie heißt du denn? Sag mir deinen Namen, damit wir Freunde werden können!";
            }
            updateStatus(answer);
            speakAnswerSafari(answer);
            return;
        }

        // 3. Normale Frage → an KI schicken (mit persönlichem Namen)
        const nameContext = childName
            ? `Das Kind heißt ${childName}. Sprich es manchmal persönlich mit seinem Namen an.`
            : `Du kennst den Namen des Kindes noch nicht. Wenn es passt, frage freundlich nach dem Namen.`;

        const systemPrompt = `Du bist "Fragmi", ein freundlicher, leuchtender Puzzle-Wisp und Erklär-Begleiter für Kinder (4-6 Jahre).

${nameContext}

DEINE AUFGABE:
Erkläre die Frage DIREKT, AUSFÜHRLICH und PERFEKT – so, dass ein 4-6-jähriges Kind es versteht und etwas lernt.

REGELN FÜR DIE ANTWORT:
1. DIREKTE ANTWORT: Beantworte die Frage sofort am Anfang.
2. DETAILLIERT: Erkläre mit 4-5 kurzen Sätzen.
3. KINDGERECHT: Einfache Worte, bildhafte Vergleiche.
4. NIEMALS Eltern erwähnen: Du antwortest selbst!
5. WICHTIG: Schreibe NUR reinen Text ohne Emojis, ohne Sternchen, ohne Markdown!`;

        try {
            const response = await puter.ai.chat([
                { role: 'system', content: systemPrompt },
                { role: 'user', content: question }
            ], { model: 'gpt-4o-mini' });

            let answer = response?.message?.content || String(response);
            answer = answer.replace(/[*_#`]/g, '').trim();

            updateStatus(answer);
            speakAnswerSafari(answer);

        } catch (err) {
            updateStatus(`Fehler: ${err.message || 'Verbindung fehlgeschlagen.'}`);
            resetWisp();
        }
    }

    function updateStatus(text) {
        document.getElementById('statusText').innerHTML = text;
    }

    function speakAnswerSafari(text) {
        if (!synth) return;

        synth.cancel();
        synth.resume();
        isSpeaking = true;

        const container = document.getElementById('wispBtn');
        container.className = "wisp-stage speaking";
        document.getElementById('wispLabel').innerText = "Liest vor...";

        const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
        let index = 0;

        function speakSentence() {
            if (index >= sentences.length || !isSpeaking) {
                isSpeaking = false;
                resetWisp();
                return;
            }

            const sentenceText = sentences[index].trim();
            if(!sentenceText) { index++; speakSentence(); return; }

            const utterance = new SpeechSynthesisUtterance(sentenceText);
            applyChildVoice(utterance, (index % 3) * 0.05);

            utterance.onend = () => {
                index++;
                setTimeout(speakSentence, 120);
            };
            utterance.onerror = () => { index++; speakSentence(); };

            synth.resume();
            synth.speak(utterance);
        }

        speakSentence();
    }

    document.addEventListener('touchstart', forceUnlockSafari, { once: true });
    document.addEventListener('click', forceUnlockSafari, { once: true });
</script>

</body>
</html>
