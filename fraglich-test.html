<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraglich – Fragmi</title>
<script src="https://js.puter.com/v2/"></script>
<style>
    :root {
        --bg: #090a10;
        --panel: rgba(22, 24, 38, 0.75);
        --accent-glow: #00f2fe;
        --accent-purple: #7928ca;
        --accent-pink: #ff0080;
        --text: #f8fafc;
        --muted: #64748b;
        --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        background: var(--bg);
        background-image:
            radial-gradient(circle at 50% 0%, rgba(121, 40, 202, 0.18), transparent 50%),
            radial-gradient(circle at 50% 100%, rgba(0, 242, 254, 0.12), transparent 50%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background: var(--panel);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 32px 24px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                    0 0 1px rgba(255, 255, 255, 0.2) inset;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        font-size: 2.2rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #fff 30%, var(--muted));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 4px;
    }

    .sub {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 24px;
    }

    .whisper-container {
        position: relative;
        width: 100%;
        height: 160px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        margin: 10px 0 20px;
    }

    .waveform {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 80px;
    }

    .bar {
        width: 6px;
        height: 16px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 99px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .whisper-container.listening .bar {
        background: linear-gradient(180deg, var(--accent-glow), var(--accent-purple));
        box-shadow: 0 0 12px var(--accent-glow);
        animation: wave 1.2s ease-in-out infinite alternate;
    }

    .whisper-container.thinking .bar {
        background: linear-gradient(180deg, #ff0080, #7928ca);
        box-shadow: 0 0 12px #ff0080;
        animation: pulseBar 0.8s ease-in-out infinite alternate;
    }

    .whisper-container.speaking .bar {
        background: linear-gradient(180deg, #00ff87, #60efff);
        box-shadow: 0 0 12px #00ff87;
        animation: wave 0.9s ease-in-out infinite alternate;
    }

    .whisper-container.listening .bar:nth-child(1) { animation-delay: 0.1s; }
    .whisper-container.listening .bar:nth-child(2) { animation-delay: 0.3s; }
    .whisper-container.listening .bar:nth-child(3) { animation-delay: 0.5s; }
    .whisper-container.listening .bar:nth-child(4) { animation-delay: 0.2s; }
    .whisper-container.listening .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes wave {
        0% { height: 12px; }
        100% { height: 65px; }
    }

    @keyframes pulseBar {
        0% { height: 20px; opacity: 0.4; }
        100% { height: 40px; opacity: 1; }
    }

    .whisper-label {
        margin-top: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
        transition: color 0.3s ease;
    }

    .input-group {
        width: 100%;
        display: flex;
        gap: 8px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 6px 6px 6px 14px;
    }

    input[type="text"] {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
    }

    input[type="text"]::placeholder { color: #475569; }

    .btn-send {
        background: var(--text);
        color: #000;
        border: none;
        border-radius: 12px;
        width: 38px;
        height: 38px;
        cursor: pointer;
        font-weight: 700;
    }

    .btn-test {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 12px;
    }

    #statusText {
        margin-top: 20px;
        width: 100%;
        min-height: 80px;
        color: #cbd5e1;
        font-size: 0.95rem;
        line-height: 1.6;
        text-align: center;
    }

    footer {
        margin-top: 32px;
        color: #475569;
        font-size: 0.75rem;
        text-align: center;
    }
</style>
</head>
<body>

<div class="card">
    <h1>Fragmi</h1>
    <p class="sub">Dein intelligenter Wissens-Begleiter</p>

    <button class="btn-test" onclick="unlockAndTestSafari()">🔊 Safari Stimme aktivieren</button>

    <div class="whisper-container" id="whisperBtn" onclick="toggleListening()">
        <div class="waveform">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="whisper-label" id="whisperLabel">Tippen zum Sprechen</div>
    </div>

    <div class="input-group">
        <input type="text" id="questionInput" placeholder="Oder Frage eintippen …" onkeydown="if(event.key==='Enter')askTyped()">
        <button class="btn-send" onclick="askTyped()">↑</button>
    </div>

    <div id="statusText">Tippe oben zuerst auf <strong>"Safari Stimme aktivieren"</strong>, damit das iPad sprechen darf! 🔊</div>
</div>

<footer>Fraglich · OpenAI/Whisper UI · Safari iPad-Fix</footer>

<script>
    let isListening = false;
    let recognition;
    let synth = window.speechSynthesis;
    let isSpeaking = false;
    let audioUnlocked = false;

    // Safari Fix: Audio-Engine sofort beim ERSTEN Klick entsperren
    function forceUnlockSafari() {
        if (!synth) return;
        synth.resume();
        const silent = new SpeechSynthesisUtterance(" ");
        silent.volume = 0.01;
        silent.lang = 'de-DE';
        synth.speak(silent);
        audioUnlocked = true;
    }

    function getGermanVoice() {
        if (!synth) return null;
        const voices = synth.getVoices();
        return voices.find(v => v.lang.startsWith('de') && v.name.includes('Anna'))
            || voices.find(v => v.lang.startsWith('de') && v.name.includes('Helena'))
            || voices.find(v => v.lang.startsWith('de') && v.name.includes('Google'))
            || voices.find(v => v.lang.startsWith('de') && v.localService)
            || voices.find(v => v.lang.startsWith('de'));
    }

    function unlockAndTestSafari() {
        forceUnlockSafari();

        setTimeout(() => {
            synth.cancel();
            const u = new SpeechSynthesisUtterance("Hallo! Ich bin Fragmi. Ich kann jetzt auch im Safari sprechen!");
            u.lang = 'de-DE';
            const v = getGermanVoice();
            if (v) u.voice = v;
            u.pitch = 1.2;
            u.rate = 0.95;

            synth.speak(u);
            updateStatus("🔊 Wenn du das hörst, ist Safari perfekt freigeschaltet!");
        }, 100);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const questionText = event.results[0][0].transcript;
            handleUserQuestion(questionText);
        };

        recognition.onerror = () => {
            updateStatus("Ich konnte dich nicht verstehen. Versuche es nochmal oder tippe unten!");
            resetWhisper();
        };

        recognition.onend = () => {
            if(isListening) resetWhisper();
        };
    }

    function toggleListening() {
        forceUnlockSafari();

        if (isSpeaking) {
            synth.cancel();
            isSpeaking = false;
            resetWhisper();
            updateStatus("Vorlesen gestoppt.");
            return;
        }

        if (!isListening) {
            isListening = true;
            const container = document.getElementById('whisperBtn');
            container.className = "whisper-container listening";
            document.getElementById('whisperLabel').innerText = "Höre zu...";
            updateStatus("Ich höre dir zu...");

            if (recognition) {
                try {
                    recognition.start();
                } catch(e) {
                    resetWhisper();
                    document.getElementById('questionInput').focus();
                }
            } else {
                resetWhisper();
                document.getElementById('questionInput').focus();
                updateStatus("Spracheingabe im Safari nicht unterstützt – bitte unten eintippen!");
            }
        } else {
            if (recognition) recognition.stop();
            resetWhisper();
        }
    }

    function askTyped() {
        forceUnlockSafari();
        const q = document.getElementById('questionInput').value.trim();
        if (!q) return;
        document.getElementById('questionInput').value = '';
        handleUserQuestion(q);
    }

    function resetWhisper() {
        isListening = false;
        const container = document.getElementById('whisperBtn');
        container.className = "whisper-container";
        document.getElementById('whisperLabel').innerText = "Tippen zum Sprechen";
    }

    async function handleUserQuestion(question) {
        resetWhisper();
        const container = document.getElementById('whisperBtn');
        container.className = "whisper-container thinking";
        document.getElementById('whisperLabel').innerText = "Verarbeite...";

        updateStatus(`<em>Fragmi denkt nach...</em>`);

        // WICHTIG FÜR SAFARI: Noch WÄHREND die KI nachdenkt, leere Utterance starten um den Kanal offen zu halten
        if (synth) {
            synth.resume();
            const dummy = new SpeechSynthesisUtterance("");
            synth.speak(dummy);
        }

        const systemPrompt = `Du bist "Fragmi", ein freundlicher, leuchtender Wissensbegleiter für Kinder (4-6 Jahre).

DEINE AUFGABE:
Erkläre die Frage DIREKT, AUSFÜHRLICH und PERFEKT – so, dass ein 4-6-jähriges Kind es versteht und etwas lernt.

REGELN FÜR DIE ANTWORT:
1. DIREKTE ANTWORT: Beantworte die Frage sofort am Anfang.
2. DETAILLIERT: Erkläre mit 4-5 kurzen Sätzen.
3. KINDGERECHT: Einfache Worte.
4. NIEMALS Eltern erwähnen: Du antwortest selbst!
5. WICHTIG: Schreiben NUR reinen Text ohne Emojis, ohne Sternchen, ohne Markdown!`;

        try {
            const response = await puter.ai.chat([
                { role: 'system', content: systemPrompt },
                { role: 'user', content: question }
            ], { model: 'gpt-4o-mini' });

            let answer = response?.message?.content || String(response);
            answer = answer.replace(/[*_#`]/g, '').trim();

            updateStatus(answer);
            speakAnswerSafari(answer);

        } catch (err) {
            updateStatus(`Fehler: ${err.message || 'Verbindung fehlgeschlagen.'}`);
            resetWhisper();
        }
    }

    function updateStatus(text) {
        document.getElementById('statusText').innerHTML = text;
    }

    // Spezieller Safari-Chunking-Mechanismus für flüssige Sprache
    function speakAnswerSafari(text) {
        if (!synth) return;

        synth.cancel();
        synth.resume(); // Safari Audio-Engine reaktivieren
        isSpeaking = true;

        const container = document.getElementById('whisperBtn');
        container.className = "whisper-container speaking";
        document.getElementById('whisperLabel').innerText = "Liest vor...";

        const germanVoice = getGermanVoice();

        // Aufteilen in einzelne Sätze
        const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
        let index = 0;

        function speakSentence() {
            if (index >= sentences.length || !isSpeaking) {
                isSpeaking = false;
                resetWhisper();
                return;
            }

            const sentenceText = sentences[index].trim();
            if(!sentenceText) {
                index++;
                speakSentence();
                return;
            }

            const utterance = new SpeechSynthesisUtterance(sentenceText);
            utterance.lang = 'de-DE';
            if (germanVoice) utterance.voice = germanVoice;
            utterance.pitch = 1.2;
            utterance.rate = 0.9;

            utterance.onend = () => {
                index++;
                speakSentence();
            };

            utterance.onerror = () => {
                index++;
                speakSentence();
            };

            // Safari braucht manchmal ein Resume zwischendurch
            synth.resume();
            synth.speak(utterance);
        }

        speakSentence();
    }

    // Event Listener für Safari Touch-Freischaltung
    document.addEventListener('touchstart', forceUnlockSafari, { once: true });
    document.addEventListener('click', forceUnlockSafari, { once: true });
</script>

</body>
</html>
