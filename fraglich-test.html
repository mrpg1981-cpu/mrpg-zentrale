<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragmi – Der Puzzle-Wisp</title>
<script src="https://js.puter.com/v2/"></script>
<style>
    :root {
        --bg: #0b1120;
        --panel: rgba(30, 41, 59, 0.7);
        --accent-teal: #38bdf8;
        --accent-glow: #00f2fe;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        background: var(--bg);
        background-image: 
            radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.15), transparent 45%),
            radial-gradient(circle at 50% 80%, rgba(15, 23, 42, 0.8), transparent 50%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background: var(--panel);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        border-radius: 32px;
        padding: 32px 24px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 
                    0 0 2px rgba(255, 255, 255, 0.2) inset;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .logo-title {
        font-size: 2.2rem;
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 2px;
    }

    .sub {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 20px;
    }

    .wisp-stage {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        margin: 10px 0;
        user-select: none;
    }

    .wisp-avatar {
        width: 180px;
        height: 180px;
        filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.4));
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease;
        animation: floatWisp 4s ease-in-out infinite alternate;
    }

    @keyframes floatWisp {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(2deg); }
    }

    .wisp-stage.listening .wisp-avatar {
        filter: drop-shadow(0 0 35px rgba(249, 115, 22, 0.8));
        animation: listenPulse 1s ease-in-out infinite alternate;
    }

    .wisp-stage.thinking .wisp-avatar {
        filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.8));
        animation: thinkSpin 2s linear infinite;
    }

    .wisp-stage.speaking .wisp-avatar {
        filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.8));
        animation: speakBounce 0.6s ease-in-out infinite alternate;
    }

    @keyframes listenPulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.08); }
    }

    @keyframes thinkSpin {
        0% { transform: rotate(0deg) scale(0.98); }
        100% { transform: rotate(360deg) scale(0.98); }
    }

    @keyframes speakBounce {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-8px) scale(1.04); }
    }

    .wisp-label {
        margin-top: 10px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        transition: color 0.3s ease;
    }

    .input-group {
        width: 100%;
        display: flex;
        gap: 8px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 6px 6px 6px 14px;
        margin-top: 10px;
    }

    input[type="text"] {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
    }

    input[type="text"]::placeholder { color: #475569; }

    .btn-send {
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        color: #fff;
        border: none;
        border-radius: 12px;
        width: 38px;
        height: 38px;
        cursor: pointer;
        font-weight: 700;
    }

    .btn-test {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
    }

    #statusText {
        margin-top: 18px;
        width: 100%;
        min-height: 75px;
        color: #cbd5e1;
        font-size: 0.95rem;
        line-height: 1.6;
        text-align: center;
    }

    footer {
        margin-top: 24px;
        color: #475569;
        font-size: 0.75rem;
        text-align: center;
    }
</style>
</head>
<body>

<div class="card">
    <div class="logo-title">FRAGMI</div>
    <p class="sub">Der kleine Puzzle-Wisp</p>

    <button class="btn-test" onclick="unlockAndTestSafari()">🔊 Safari Stimme aktivieren</button>

    <div class="wisp-stage" id="wispBtn" onclick="toggleListening()">
        <svg class="wisp-avatar" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="wispBody" cx="40%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#7dd3fc" />
                    <stop offset="50%" stop-color="#0284c7" />
                    <stop offset="100%" stop-color="#0f172a" />
                </radialGradient>
                <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#38bdf8" />
                </radialGradient>
            </defs>

            <path d="M100 20 C150 20, 180 60, 180 110 C180 160, 140 190, 100 190 C70 190, 40 210, 25 215 C45 185, 20 150, 20 110 C20 60, 50 20, 100 20 Z" fill="url(#wispBody)" />
            
            <path d="M60 40 C80 35, 110 45, 130 35" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-dasharray="4 4"/>
            <path d="M35 90 C70 80, 130 95, 165 85" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
            <path d="M50 140 C80 130, 120 145, 150 130" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="6 3"/>
            <path d="M100 20 C100 70, 110 130, 100 190" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

            <circle cx="72" cy="100" r="22" fill="#0f172a" />
            <circle cx="72" cy="100" r="20" fill="url(#eyeGlow)" />
            <circle cx="72" cy="100" r="13" fill="#030712" />
            <circle cx="66" cy="94" r="6" fill="#ffffff" />
            <circle cx="77" cy="105" r="2.5" fill="#ffffff" />

            <circle cx="128" cy="100" r="22" fill="#0f172a" />
            <circle cx="128" cy="100" r="20" fill="url(#eyeGlow)" />
            <circle cx="128" cy="100" r="13" fill="#030712" />
            <circle cx="122" cy="94" r="6" fill="#ffffff" />
            <circle cx="133" cy="105" r="2.5" fill="#ffffff" />

            <path d="M90 130 Q100 138 110 130" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
            
            <circle cx="55" cy="118" r="8" fill="#38bdf8" opacity="0.3" />
            <circle cx="145" cy="118" r="8" fill="#38bdf8" opacity="0.3" />
        </svg>
        <div class="wisp-label" id="wispLabel">Drücken zum Sprechen</div>
    </div>

    <div class="input-group">
        <input type="text" id="questionInput" placeholder="Oder Frage eintippen …" onkeydown="if(event.key==='Enter')askTyped()">
        <button class="btn-send" onclick="askTyped()">↑</button>
    </div>

    <div id="statusText">Tippe oben zuerst auf <strong>"Safari Stimme aktivieren"</strong>! 🧩✨</div>
</div>

<footer>Fragmi · Design Vorschlag A · Puter.js KI</footer>

<script>
    let isListening = false;
    let recognition;
    let synth = window.speechSynthesis;
    let isSpeaking = false;

    function forceUnlockSafari() {
        if (!synth) return;
        synth.resume();
        const silent = new SpeechSynthesisUtterance(" ");
        silent.volume = 0.01;
        silent.lang = 'de-DE';
        synth.speak(silent);
    }

    function getGermanVoice() {
        if (!synth) return null;
        const voices = synth.getVoices();
        return voices.find(v => v.lang.startsWith('de') && v.name.includes('Anna'))
            || voices.find(v => v.lang.startsWith('de') && v.name.includes('Helena'))
            || voices.find(v => v.lang.startsWith('de') && v.name.includes('Google'))
            || voices.find(v => v.lang.startsWith('de') && v.localService)
            || voices.find(v => v.lang.startsWith('de'));
    }

    function unlockAndTestSafari() {
        forceUnlockSafari();
        setTimeout(() => {
            synth.cancel();
            const u = new SpeechSynthesisUtterance("Hallo! Ich bin Fragmi, dein Puzzle-Wisp! Ich bin bereit für deine Fragen.");
            u.lang = 'de-DE';
            const v = getGermanVoice();
            if (v) u.voice = v;
            u.pitch = 1.25;
            u.rate = 0.9;
            synth.speak(u);
            updateStatus("🔊 Perfekt! Fragmi ist freigeschaltet und kann sprechen.");
        }, 100);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const questionText = event.results[0][0].transcript;
            handleUserQuestion(questionText);
        };

        recognition.onerror = () => {
            updateStatus("Ich konnte dich nicht verstehen. Versuche es nochmal oder tippe unten!");
            resetWisp();
        };

        recognition.onend = () => {
            if(isListening) resetWisp();
        };
    }

    function toggleListening() {
        forceUnlockSafari();

        if (isSpeaking) {
            synth.cancel();
            isSpeaking = false;
            resetWisp();
            updateStatus("Vorlesen gestoppt.");
            return;
        }

        if (!isListening) {
            isListening = true;
            const container = document.getElementById('wispBtn');
            container.className = "wisp-stage listening";
            document.getElementById('wispLabel').innerText = "Höre zu...";
            updateStatus("Ich höre dir zu...");

            if (recognition) {
                try { recognition.start(); } catch(e) { resetWisp(); }
            } else {
                resetWisp();
                document.getElementById('questionInput').focus();
                updateStatus("Spracheingabe hier nicht unterstützt – bitte eintippen!");
            }
        } else {
            if (recognition) recognition.stop();
            resetWisp();
        }
    }

    function askTyped() {
        forceUnlockSafari();
        const q = document.getElementById('questionInput').value.trim();
        if (!q) return;
        document.getElementById('questionInput').value = '';
        handleUserQuestion(q);
    }

    function resetWisp() {
        isListening = false;
        const container = document.getElementById('wispBtn');
        container.className = "wisp-stage";
        document.getElementById('wispLabel').innerText = "Drücken zum Sprechen";
    }

    async function handleUserQuestion(question) {
        resetWisp();
        const container = document.getElementById('wispBtn');
        container.className = "wisp-stage thinking";
        document.getElementById('wispLabel').innerText = "Denkt nach...";

        updateStatus(`<em>Fragmi denkt nach...</em>`);

        if (synth) {
            synth.resume();
            const dummy = new SpeechSynthesisUtterance("");
            synth.speak(dummy);
        }

        const systemPrompt = `Du bist "Fragmi", ein freundlicher, leuchtender Puzzle-Wisp und Erklär-Begleiter für Kinder (4-6 Jahre).

DEINE AUFGABE:
Erkläre die Frage DIREKT, AUSFÜHRLICH und PERFEKT – so, dass ein 4-6-jähriges Kind es versteht und etwas lernt.

REGELN FÜR DIE ANTWORT:
1. DIREKTE ANTWORT: Beantworte die Frage sofort am Anfang.
2. DETAILLIERT: Erkläre mit 4-5 kurzen Sätzen.
3. KINDGERECHT: Einfache Worte, bildhafte Vergleiche.
4. NIEMALS Eltern erwähnen: Du antwortest selbst!
5. WICHTIG: Schreibe NUR reinen Text ohne Emojis, ohne Sternchen, ohne Markdown!`;

        try {
            const response = await puter.ai.chat([
                { role: 'system', content: systemPrompt },
                { role: 'user', content: question }
            ], { model: 'gpt-4o-mini' });

            let answer = response?.message?.content || String(response);
            answer = answer.replace(/[*_#`]/g, '').trim();

            updateStatus(answer);
            speakAnswerSafari(answer);

        } catch (err) {
            updateStatus(`Fehler: ${err.message || 'Verbindung fehlgeschlagen.'}`);
            resetWisp();
        }
    }

    function updateStatus(text) {
        document.getElementById('statusText').innerHTML = text;
    }

    function speakAnswerSafari(text) {
        if (!synth) return;

        synth.cancel();
        synth.resume();
        isSpeaking = true;

        const container = document.getElementById('wispBtn');
        container.className = "wisp-stage speaking";
        document.getElementById('wispLabel').innerText = "Liest vor...";

        const germanVoice = getGermanVoice();
        const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
        let index = 0;

        function speakSentence() {
            if (index >= sentences.length || !isSpeaking) {
                isSpeaking = false;
                resetWisp();
                return;
            }

            const sentenceText = sentences[index].trim();
            if(!sentenceText) { index++; speakSentence(); return; }

            const utterance = new SpeechSynthesisUtterance(sentenceText);
            utterance.lang = 'de-DE';
            if (germanVoice) utterance.voice = germanVoice;
            utterance.pitch = 1.25;
            utterance.rate = 0.9;

            utterance.onend = () => { index++; speakSentence(); };
            utterance.onerror = () => { index++; speakSentence(); };

            synth.resume();
            synth.speak(utterance);
        }

        speakSentence();
    }

    document.addEventListener('touchstart', forceUnlockSafari, { once: true });
    document.addEventListener('click', forceUnlockSafari, { once: true });
</script>

</body>
</html>
