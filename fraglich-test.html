<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraglich – Fragmi</title>
<script src="https://js.puter.com/v2/"></script>
<style>
    :root {
        --bg: #1a1a2e;
        --panel: #252542;
        --accent: #7b5cff;
        --accent2: #00d4ff;
        --text: #f0f0ff;
        --muted: #a0a0c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        background: linear-gradient(160deg, #0f0f23, #1a1a2e);
        color: var(--text);
        font-family: system-ui, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }
    h1 {
        font-size: 2rem;
        margin: 20px 0 6px;
        background: linear-gradient(90deg, var(--accent2), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-align: center;
    }
    .sub {
        color: var(--muted);
        margin-bottom: 24px;
        text-align: center;
        font-size: 0.95rem;
    }
    .card {
        background: var(--panel);
        border: 1px solid rgba(123,92,255,.35);
        border-radius: 16px;
        padding: 22px;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .badge {
        display: inline-block;
        background: rgba(63,185,80,.15);
        border: 1px solid #3fb950;
        color: #3fb950;
        border-radius: 99px;
        padding: 6px 14px;
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 8px;
    }
    .wisp-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 24px 0 10px;
    }
    #wispBtn {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 3px solid var(--accent);
        background: radial-gradient(circle at 35% 30%, #3a3a6e, #1a1a30);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: transform .2s, box-shadow .2s;
        box-shadow: 0 0 25px rgba(123,92,255,.35);
    }
    #wispBtn:hover { transform: scale(1.05); }
    #wispBtn.listening {
        border-color: var(--accent2);
        box-shadow: 0 0 45px rgba(0,212,255,.7);
        animation: pulse 1.2s infinite;
    }
    #wispBtn.thinking {
        border-color: #ffd166;
        box-shadow: 0 0 45px rgba(255,209,102,.6);
    }
    #wispBtn.speaking {
        border-color: #3fb950;
        box-shadow: 0 0 45px rgba(63,185,80,.7);
        animation: pulse 1s infinite;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
    #wispIcon { font-size: 3rem; }
    #wispLabel {
        font-size: 0.75rem;
        letter-spacing: 2px;
        color: var(--muted);
        font-weight: 700;
    }
    .textrow {
        display: flex;
        gap: 8px;
        margin-top: 16px;
    }
    input[type="text"] {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(123,92,255,.4);
        background: #1a1a30;
        color: var(--text);
        font-size: 1rem;
    }
    input:focus { outline: none; border-color: var(--accent2); }
    .btn {
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn.secondary {
        background: var(--panel);
        border: 1px solid rgba(123,92,255,.4);
        width: 100%;
        margin-top: 12px;
    }
    #statusText {
        margin-top: 22px;
        min-height: 70px;
        width: 100%;
        background: #1a1a30;
        border: 1px solid rgba(123,92,255,.25);
        border-radius: 12px;
        padding: 16px;
        font-size: 0.95rem;
        line-height: 1.6;
        text-align: center;
    }
    footer {
        margin-top: 26px;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: center;
    }
</style>
</head>
<body>

<h1>🧩 Fraglich</h1>
<p class="sub">Fragmi – dein freundlicher Erklär-Wisp</p>

<div class="card">
    <div style="text-align:center">
        <span class="badge">🔊 Fragmi liest dir alles laut vor!</span>
    </div>

    <button class="btn secondary" onclick="testVoice()">🔊 1. Zuerst hier tippen: Stimme testen</button>

    <div class="wisp-area">
        <button id="wispBtn" onclick="toggleListening()">
            <span id="wispIcon">🧩</span>
            <span id="wispLabel">DRÜCKEN</span>
        </button>
    </div>

    <div class="textrow">
        <input type="text" id="questionInput" placeholder="2. Frage hier eintippen …" onkeydown="if(event.key==='Enter')askTyped()">
        <button class="btn" onclick="askTyped()">Fragen</button>
    </div>

    <div id="statusText">Hallo! Ich bin Fragmi. Tippe zuerst oben auf „Stimme testen" – dann stell mir eine Frage! 🔊✨</div>
</div>

<footer>Fraglich · Kostenlos via Puter.js · Kein Key, kein Server nötig</footer>

<script>
    let isListening = false;
    let recognition;
    let synth = window.speechSynthesis;
    let isSpeaking = false;
    let speechUnlocked = false;

    function loadVoices() {
        if (synth) synth.getVoices();
    }
    loadVoices();
    if (synth) synth.onvoiceschanged = loadVoices;

    // WICHTIG für iPad: Sprach-Engine durch direkten Tipp freischalten
    function unlockSpeech() {
        if (!synth || speechUnlocked) return;
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0.01;
        u.lang = 'de-DE';
        synth.speak(u);
        speechUnlocked = true;
    }

    function getGermanVoice() {
        const voices = synth.getVoices();
        return voices.find(v => v.lang.startsWith('de') && v.name.includes('Google'))
            || voices.find(v => v.lang.startsWith('de') && v.name.includes('Anna'))
            || voices.find(v => v.lang.startsWith('de') && v.name.includes('Helena'))
            || voices.find(v => v.lang.startsWith('de') && v.localService)
            || voices.find(v => v.lang.startsWith('de'));
    }

    // Test-Button: Direkter Tipp = Sprache funktioniert garantiert
    function testVoice() {
        if (!synth) {
            updateStatus("⚠️ Dein Browser unterstützt leider keine Sprachausgabe.");
            return;
        }
        loadVoices();
        synth.cancel();

        const u = new SpeechSynthesisUtterance("Hallo! Ich bin Fragmi, dein Puzzle-Wisp. Wenn du mich hörst, funktioniert alles!");
        u.lang = 'de-DE';
        const v = getGermanVoice();
        if (v) u.voice = v;
        u.pitch = 1.3;
        u.rate = 0.9;
        u.volume = 1.0;

        speechUnlocked = true;
        synth.speak(u);
        updateStatus("🔊 Hörst du mich? Wenn ja: Super! Dann stell mir unten eine Frage. Wenn nein: Prüfe die Lautstärke deines iPads und ob der Stumm-Schalter aus ist.");
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const questionText = event.results[0][0].transcript;
            handleUserQuestion(questionText);
        };

        recognition.onerror = () => {
            updateStatus("Hoppla, das habe ich nicht verstanden. Versuch es nochmal – oder tippe deine Frage ein!");
            resetWisp();
        };

        recognition.onend = () => {
            if(isListening) resetWisp();
        };
    }

    function toggleListening() {
        unlockSpeech();
        loadVoices();

        if (isSpeaking) {
            synth.cancel();
            isSpeaking = false;
            resetWisp();
            updateStatus("Okay, ich bin still! Drück mich für eine neue Frage. 🧩");
            return;
        }

        if (!isListening) {
            isListening = true;
            const wisp = document.getElementById('wispBtn');
            wisp.classList.add('listening');
            document.getElementById('wispIcon').innerText = "🎙️";
            document.getElementById('wispLabel').innerText = "ZUHÖREN...";
            updateStatus("Ich höre dir zu...");

            if (recognition) {
                recognition.start();
            } else {
                resetWisp();
                document.getElementById('questionInput').focus();
                updateStatus("Spracheingabe geht hier nicht – tippe deine Frage einfach unten ein! ⌨️");
            }
        } else {
            if (recognition) recognition.stop();
            resetWisp();
        }
    }

    function askTyped() {
        unlockSpeech();
        loadVoices();
        const q = document.getElementById('questionInput').value.trim();
        if (!q) return;
        document.getElementById('questionInput').value = '';
        handleUserQuestion(q);
    }

    function resetWisp() {
        isListening = false;
        const wisp = document.getElementById('wispBtn');
        wisp.classList.remove('listening', 'thinking', 'speaking');
        document.getElementById('wispIcon').innerText = "🧩";
        document.getElementById('wispLabel').innerText = "DRÜCKEN";
    }

    async function handleUserQuestion(question) {
        resetWisp();
        const wisp = document.getElementById('wispBtn');
        wisp.classList.add('thinking');
        document.getElementById('wispIcon').innerText = "✨";
        document.getElementById('wispLabel').innerText = "DENKT...";

        updateStatus(`<em>Fragmi denkt nach...</em>`);

        const systemPrompt = `Du bist "Fragmi", ein freundlicher, leuchtender Puzzle-Wisp und Erklär-Begleiter für Kinder (4-6 Jahre).

DEINE AUFGABE:
Erkläre die Frage DIREKT, AUSFÜHRLICH und PERFEKT – so, dass ein 4-6-jähriges Kind es versteht und etwas lernt.

REGELN FÜR DIE PERFEKTE ANTWORT:
1. DIREKTE ANTWORT: Beantworte die Frage sofort am Anfang.
2. DETAILLIERT: Erkläre mit 5-7 Sätzen. Erst die einfache Antwort, dann ein Beispiel aus der Kinderwelt, dann eine spannende Zusatzinfo.
3. KINDGERECHT: Einfache, klare Worte. Vergleiche mit Tieren, Spielzeug, Essen oder Märchen.
4. BEGEISTERND: Freundlich, warm und ein bisschen magisch.
5. NIEMALS Eltern erwähnen: Sage NIEMALS "frag Mama oder Papa" oder ähnliches. Du bist der Experte und antwortest immer selbst!
6. SICHERHEIT: Nur bei echten Gefahren für das Kind (z.B. Feuer, Verkehr) erkläre kurz und liebevoll, warum man vorsichtig sein muss.
7. STIL: Beginne mit "Das ist eine tolle Frage!" oder "Ich erkläre es dir genau!"
8. WICHTIG: Schreibe NUR reinen Text ohne Emojis, ohne Sternchen, ohne Markdown – der Text wird vorgelesen!`;

        try {
            const response = await puter.ai.chat([
                { role: 'system', content: systemPrompt },
                { role: 'user', content: question }
            ], { model: 'gpt-4o-mini' });

            let answer = response?.message?.content || String(response);
            answer = answer.replace(/[*_#`]/g, '').trim();

            updateStatus(`<strong>Fragmi sagt:</strong><br>${answer}`);
            speakAnswer(answer);

        } catch (err) {
            updateStatus(`Oh je, Fehler: ${err.message || 'Keine Verbindung! Versuch es gleich nochmal.'}`);
            resetWisp();
        }
    }

    function updateStatus(text) {
        document.getElementById('statusText').innerHTML = text;
    }

    function speakAnswer(text) {
        if (!synth) return;

        synth.cancel();
        isSpeaking = true;

        const wisp = document.getElementById('wispBtn');
        wisp.classList.remove('thinking');
        wisp.classList.add('speaking');
        document.getElementById('wispIcon').innerText = "🔊";
        document.getElementById('wispLabel').innerText = "LEST VOR...";

        const germanVoice = getGermanVoice();

        // iPad-Fix: Text in Sätze aufteilen
        const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
        let index = 0;

        function speakNext() {
            if (index >= sentences.length || !isSpeaking) {
                isSpeaking = false;
                resetWisp();
                return;
            }

            const utterance = new SpeechSynthesisUtterance(sentences[index].trim());
            utterance.lang = 'de-DE';
            if (germanVoice) utterance.voice = germanVoice;
            utterance.pitch = 1.3;
            utterance.rate = 0.9;
            utterance.volume = 1.0;

            utterance.onend = () => {
                index++;
                speakNext();
            };

            utterance.onerror = () => {
                index++;
                speakNext();
            };

            synth.speak(utterance);

            // iPad-Fix: Engine wach halten
            if (synth.paused) synth.resume();
        }

        setTimeout(speakNext, 150);
    }

    document.addEventListener('touchstart', () => { loadVoices(); unlockSpeech(); }, { once: true });
    document.addEventListener('click', () => { loadVoices(); unlockSpeech(); }, { once: true });
</script>

</body>
</html>
