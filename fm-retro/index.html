<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FM Retro 97</title>
<style>
/* MrPG-Design: Navy-Grund, Glas-Panels, Türkis/Orange-Akzente */
:root{--bg:#0b1120;--panel:rgba(30,41,59,.7);--line:rgba(255,255,255,.1);--txt:#f8fafc;--dim:#94a3b8;--acc:#38bdf8;--acc2:#f97316;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(circle at 50% 0%,rgba(56,189,248,.15),transparent 45%);background-attachment:fixed;color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,17,32,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#status{color:var(--dim);flex:1 1 100%;order:3;min-width:0;font-size:13px}header h1{flex:1}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;max-width:1100px;margin:auto}
nav button,.btn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
nav button:hover,.btn:hover{border-color:var(--acc)}nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav button.on{background:rgba(56,189,248,.18);border-color:var(--acc);color:var(--acc)}
.btn.big{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
main{padding:8px 16px 24px;max-width:1100px;margin:auto}
.box{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;overflow-x:auto;min-width:0}
h2{margin:0 0 10px;color:var(--acc);font-size:13px;text-transform:uppercase;letter-spacing:1.2px}
table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--dim);font-weight:500;font-size:12px}
tr.me{background:rgba(249,115,22,.14)}.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
#ticker{max-height:260px;min-height:60px;overflow-y:auto;background:rgba(0,0,0,.35);border-radius:10px;color:var(--acc);padding:10px;font-family:ui-monospace,Menlo,monospace}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.grid .box{margin:0}.grid{margin-bottom:12px}
select,input{background:rgba(0,0,0,.35);color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit;padding:5px 8px}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mbox{background:#111a2e;border:1px solid var(--acc);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90%;overflow-y:auto}.mbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.score{font-size:28px;font-weight:700;text-align:center;color:var(--txt)}
.ic{font-style:normal;opacity:.7;margin-right:5px}
.crest{vertical-align:middle;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}.cn{display:inline-flex;align-items:center;gap:7px}
.hero{display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:12px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(56,189,248,.18),rgba(249,115,22,.12));flex-wrap:wrap}
.hero .club{margin:0;font-size:clamp(22px,5vw,32px);text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile small{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}.tile b{font-size:20px;overflow-wrap:anywhere}.tile span{color:var(--dim);font-size:12px}
.tile.neg b{color:var(--bad)}.tile.comp{border-top:3px solid var(--cc)}.tile.comp.on{background:color-mix(in srgb,var(--cc) 18%,transparent);border-color:var(--cc)}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pitchwrap{max-width:420px;margin:auto}.pitch{width:100%;height:auto;display:block}
.form{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.scroll{overflow-x:auto}.scroll.tall{max-height:520px;overflow-y:auto}
.rk{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:6px;font-weight:700;font-size:12px;background:rgba(255,255,255,.06)}
.legend .rk{min-width:14px;height:14px;margin:0 4px 0 10px;vertical-align:middle}.legend{margin-top:10px;color:var(--dim);font-size:12px}
.z-cl{background:#1d4ed8;color:#fff}.z-el{background:#c2410c;color:#fff}.z-ecl{background:#15803d;color:#fff}.z-up{background:#15803d;color:#fff}.z-rel{background:#a16207;color:#fff}.z-down{background:#b91c1c;color:#fff}
.match .mhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px;border-radius:14px;background:rgba(0,0,0,.35)}
.board .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}.board .side b{font-size:14px;overflow-wrap:anywhere}
.board .sc{font-size:clamp(34px,9vw,52px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px}.board .sc i{font-style:normal;color:var(--dim);margin:0 4px}
.board.small .sc{font-size:26px}
.minipitch{position:relative;height:70px;margin:12px 0;border-radius:10px;background:repeating-linear-gradient(90deg,#166534 0 40px,#15803d 40px 80px);border:2px solid rgba(255,255,255,.5);overflow:hidden}
.minipitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.5)}.minipitch:after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border:2px solid rgba(255,255,255,.5);border-radius:50%}
.ball{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #0b1120;animation:ball 7s ease-in-out infinite;z-index:1}
@keyframes ball{0%{left:48%;top:45%}15%{left:70%;top:20%}30%{left:88%;top:55%}45%{left:60%;top:75%}60%{left:25%;top:30%}75%{left:8%;top:50%}90%{left:35%;top:70%}100%{left:48%;top:45%}}
.mstats{display:grid;gap:8px;margin:12px 0}.ms{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;font-variant-numeric:tabular-nums}.ms small{grid-column:1/-1;text-align:center;color:var(--dim);margin-top:-6px;font-size:11px}
.ms span:last-of-type{text-align:right}.msbar{display:flex;gap:2px;height:8px}.msbar i{background:var(--acc);border-radius:4px 0 0 4px}.msbar b{background:var(--acc2);border-radius:0 4px 4px 0}
.res{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.chart{position:relative}.chart .tip{position:absolute;top:0;background:#111a2e;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;pointer-events:none;white-space:nowrap}
.fin{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}.fin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar{height:8px;background:rgba(0,0,0,.3);border-radius:4px}.fbar i{display:block;height:8px;border-radius:4px;background:var(--ok)}.fbar i.neg{background:var(--bad)}
.sbar{position:relative;width:110px;height:18px;background:rgba(0,0,0,.3);border-radius:4px}.sbar i{display:block;height:18px;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2))}.sbar span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px;font-weight:700}
.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.br{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.2)}
.br small{color:var(--dim);font-size:11px}.br.win{border-color:var(--ok)}.br.loss{border-color:var(--bad);opacity:.7}.br.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.news{max-height:320px;overflow-y:auto;display:grid;gap:6px}.news div{padding-bottom:6px;border-bottom:1px solid var(--line)}
.xrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.games{display:grid;gap:8px}.game small{display:block;margin-bottom:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
@media (prefers-reduced-motion:reduce){.ball{animation:none;left:48%;top:45%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>MrPG · FM Retro 97</h1><span id="status"></span>
<button class="btn" onclick="save()">Speichern</button><button class="btn" onclick="go('optionen')">Einstellungen</button></header>
<nav id="nav"></nav>
<main id="view"></main>
<div id="modal" hidden><div class="mbox"><div class="mbody"></div><div class="mbtns"></div></div></div>
<script>
// ===== Dialoge =====
function modal(html,btns){const m=document.getElementById("modal");m.querySelector(".mbody").innerHTML=html;const b=m.querySelector(".mbtns");b.innerHTML="";
 btns.forEach(([l,fn])=>{const e=document.createElement("button");e.className="btn";e.textContent=l;e.onclick=()=>{m.hidden=true;fn&&fn()};b.appendChild(e)});m.hidden=false}
const Q=[];function say(t,fn){queue(t,[["OK",fn]])}function ask(t,o){queue(t,o)}
function queue(t,o){Q.push([t,o]);if(Q.length===1)showQ()}
function showQ(){if(!Q.length)return;const [t,o]=Q[0];modal(t,o.map(([l,fn])=>[l,()=>{Q.shift();fn&&fn();showQ()}]))}
function num(t,d,cb){ask(t+'<br><input id="numin" type="number" value="'+d+'">',[["OK",()=>{const v=+document.getElementById("numin").value;if(v>0)cb(v)}],["Abbrechen"]])}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ===== Stammdaten =====
// Saison 2026/27 (Stand: September 2026)
const LIGA1=[["FC Bayern München",92],["Borussia Dortmund",86],["Bayer 04 Leverkusen",84],["RB Leipzig",83],["VfB Stuttgart",80],["Eintracht Frankfurt",79],["TSG Hoffenheim",78],["SC Freiburg",76],["Borussia Mönchengladbach",73],["1. FSV Mainz 05",72],["FC Augsburg",71],["1. FC Union Berlin",71],["SV Werder Bremen",71],["Hamburger SV",70],["1. FC Köln",70],["FC Schalke 04",69],["SV Elversberg",66],["SC Paderborn 07",66]];
const LIGA2=[["VfL Wolfsburg",70],["1. FC Heidenheim",67],["FC St. Pauli",67],["Hertha BSC",66],["1. FC Kaiserslautern",64],["VfL Bochum",64],["Hannover 96",64],["1. FC Nürnberg",63],["Holstein Kiel",63],["SV Darmstadt 98",63],["1. FC Magdeburg",62],["Arminia Bielefeld",62],["Karlsruher SC",62],["SpVgg Greuther Fürth",60],["Dynamo Dresden",60],["Eintracht Braunschweig",59],["Energie Cottbus",59],["VfL Osnabrück",58]];
const LIGA3=[["Fortuna Düsseldorf",60],["FC Hansa Rostock",58],["MSV Duisburg",57],["Preußen Münster",57],["Rot-Weiss Essen",56],["1. FC Saarbrücken",56],["Alemannia Aachen",56],["Jahn Regensburg",56],["SV Wehen Wiesbaden",56],["SV Waldhof Mannheim",55],["FC Ingolstadt 04",55],["FC Viktoria Köln",54],["SC Verl",54],["TSG Hoffenheim II",52],["VfB Stuttgart II",52],["FC Würzburger Kickers",52],["SV Meppen",52],["SG Sonnenhof Großaspach",50],["SC Fortuna Köln",50],["TSV Havelse",49]];
const REGIO=[["Kickers Offenbach",51],["Rot-Weiß Oberhausen",50],["1. FC Lok Leipzig",50],["Chemnitzer FC",50],["FC Carl Zeiss Jena",51],["Wuppertaler SV",48],["SV Babelsberg 03",47],["TSV 1860 München",54]];
const LN={1:"1. Bundesliga",2:"2. Bundesliga",3:"3. Liga",4:"Regionalliga"};
const EUROPA=[["Real Madrid",92],["FC Barcelona",90],["Manchester City",93],["Liverpool FC",90],["Inter Mailand",88],["AC Mailand",85],["Juventus Turin",85],["Paris SG",89],["Ajax Amsterdam",80],["FC Porto",81],["Benfica Lissabon",82],["Celtic Glasgow",76],["Galatasaray",79],["Atlético Madrid",87],["Olympique Lyon",79],["RSC Anderlecht",74],["Dynamo Kiew",75],["Sparta Prag",74]];
const VN="Andreas Bernd Carsten Dirk Frank Jens Kai Lars Marco Mario Oliver Ralf Sven Thomas Uwe Stefan Jürgen Holger Mehmet Dariusz Jan Timo Lukas Niklas Florian Paul Leon Jonas Felix Emre".split(" ");
const NN="Müller Schmidt Schneider Fischer Weber Meyer Wagner Becker Schulz Hoffmann Koch Richter Klein Wolf Neumann Braun Zimmermann Krüger Hartmann Lange Werner Krause Lehmann Köhler Kaya Nowak Jansen Berger Vogel Frank Engel Roth".split(" ");
const POS=["TW","AB","MF","ST"],FORM={"4-4-2":[1,4,4,2],"4-3-3":[1,4,3,3],"3-5-2":[1,3,5,2],"5-3-2":[1,5,3,2],"4-5-1":[1,4,5,1],"3-4-3":[1,3,4,3]};
const CHAR=["Profi","Führungsspieler","Launisch","Faulpelz","Kämpfer","Talent"];
const CUPMD=[4,12,20,26,31],WINTER=17;
const STADX={roof:["Tribünendach",3000000,"+10% Zuschauer bei Regen/Schnee"],light:["Flutlicht",1500000,"Abendspiele: +5% Zuschauer, Europapokal-Pflicht"],heat:["Rasenheizung",1200000,"keine Spielausfälle bei Schnee"],board:["Anzeigetafel",800000,"+2 Werbebanden-Plätze"],park:["Parkplätze",1000000,"+5% Zuschauer"],vip:["VIP-Logen",4000000,"+120.000 DM pro Heimspiel"]};
const CAMPS={"Kein":[0,0],"Sportschule Kaiserau":[150000,0.02],"Mallorca":[400000,0.035],"Türkische Riviera":[600000,0.05]};
const DEFAULTS={diff:"normal",speed:450,ticker:true,inj:1,cur:"DM",autosave:true,transfers:true,euro:true,cup:true,liga2:true,press:true,jobs:true,weather:true,riots:true};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let G,cur="büro",tblLg=1,edClub=null;
const S=()=>G.set;
const eur=n=>{const e=S().cur==="€",v=e?n/1.95583:n;return(v<0?"-":"")+Math.abs(Math.round(v)).toLocaleString("de-DE")+(e?" €":" DM")};
const DIFF={leicht:{money:1.5,ai:0.95},normal:{money:1,ai:1},schwer:{money:0.7,ai:1.05}};

// ===== Namensvorlagen (Editor) =====
function tplLoad(){try{return JSON.parse(localStorage.getItem("fmretro97names"))||null}catch(e){return null}}
function tplSave(t){try{localStorage.setItem("fmretro97names",JSON.stringify(t))}catch(e){}}

// ===== Erzeugung =====
function mkPlayer(pos,base,young){const age=young?rnd(16,18):rnd(18,34);const st=clamp(base+rnd(-12,8)-(young?15:0),30,99);
 const p={id:Math.random().toString(36).slice(2),name:pick(VN)+" "+pick(NN),pos,age,st,pot:Math.min(95,st+(age<23?rnd(3,14):rnd(0,3))),form:rnd(4,7),fit:100,mor:rnd(5,8),char:pick(CHAR),
 inj:0,sus:0,yel:0,goals:0,games:0,nat:false,wage:Math.round(st*st*12/1000)*1000,contract:rnd(1,4),value:0,benched:0};p.value=val(p);return p}
function val(p){return Math.max(50000,Math.round(Math.pow(p.st,3)*(p.age<24?14:p.age>30?6:10)/1000)*1000)}
function mkTeam(n,s,i,lg){const sq=[];[3,8,8,5].forEach((c,pi)=>{for(let k=0;k<c;k++)sq.push(mkPlayer(POS[pi],s))});
 return{id:i,name:n,lg,str:s,squad:sq,form:"4-4-2",style:"normal",press:"mittel",hard:"normal",offside:false,cap:null,pen:null,
 money:s*s*(lg===1?2500:lg===2?1500:800),stadium:({1:15000,2:8000,3:4000,4:2000}[lg]||15000)+s*450,price:{1:25,2:18,3:14,4:10}[lg]||25,fans:s*({1:500,2:300,3:160,4:80}[lg]||500),pts:0,gf:0,ga:0,w:0,d:0,l:0}}
function newGame(){const tpl=tplLoad();const all=[...LIGA1.map(c=>[...c,1]),...LIGA2.map(c=>[...c,2]),...LIGA3.map(c=>[...c,3]),...REGIO.map(c=>[...c,4])].map((c,i)=>tpl&&tpl.clubs[i]&&tpl.clubs[i].name?[tpl.clubs[i].name,c[1],c[2]]:c);
 ask("<b>Neues Spiel – Verein wählen</b><br><span class=dim>Alle Vereine der 1., 2. und 3. Liga 2026/27</span>",all.filter(c=>c[2]<4).map((c,i)=>[LN[c[2]]+" · "+c[0]+" ("+c[1]+")",()=>askName(i,all,tpl)]))}
function askName(me,all,tpl){ask('Dein Managername:<br><input id="mname" value="'+esc((G&&G.mgr&&G.mgr.name)||"Manager")+'">',[["Los geht's",()=>startGame(me,all,tpl,document.getElementById("mname").value||"Manager")]])}
function startGame(me,all,tpl,mname){const set=Object.assign({},DEFAULTS,G&&G.set);
 const teams=all.map((c,i)=>{const t=mkTeam(c[0],c[1],i,c[2]);if(tpl&&tpl.clubs[i])tpl.clubs[i].players.forEach((n,k)=>{if(t.squad[k]&&n)t.squad[k].name=n});return t});
 G={set,season:2026,md:0,me,teams,fix:{},news:[],board:60,fansMood:60,mgr:{name:mname,rep:40,career:[]},
 trainer:{skill:rnd(40,70),wage:30000},training:"Ausgewogen",youth:1,merch:1,camp:"Kein",sponsor:null,banners:[],loans:[],stad:{},build:null,
 log:[],cup:true,cupRound:0,intl:null,qual:null,moneyHist:[],posHist:[],dflSuper:null,uefaSuper:false,cwc:false,cupWinner:null,won:[],history:[],last:null,market:[],xi:null,weather:"Sonne"};
 {const l1s=teams.filter(t=>t.lg===1).sort((a,b)=>b.str-a.str),q={};l1s.slice(0,4).forEach(t=>q[t.id]="CL");q[l1s[4].id]="EL";q[l1s[5].id]="EL";q[l1s[6].id]="ECL";G.qual=q;G.dflSuper=[l1s[0].id,l1s[1].id]}
 mkFix();genMarket();intlSetup();news("Willkommen, "+esc(mname)+"! Du übernimmst "+esc(my().name)+". Ziel: Platz "+aim()+".");
 offerSponsors();offerBanners();go("büro")}
function schedule(ids){const r=[],n=ids.length;let a=ids.slice();for(let d=0;d<n-1;d++){const m=[];for(let i=0;i<n/2;i++){const h=a[i],g=a[n-1-i];m.push(d%2?[g,h]:[h,g])}r.push(m);a=[a[0],a[n-1],...a.slice(1,n-1)]}
 return r.concat(r.map(md=>md.map(([h,g])=>[g,h])))}
function mkFix(){[1,2,3].forEach(l=>G.fix[l]=schedule(G.teams.filter(t=>t.lg===l).map(t=>t.id).sort(()=>Math.random()-.5)))}
const my=()=>G.teams[G.me],T=id=>G.teams[id];
function news(t){G.news.unshift("<b>"+(G.md+1)+". ST</b> "+t);G.news=G.news.slice(0,50)}
function aim(){const t=my();if(t.lg===2)return t.str>64?3:9;if(t.lg===3)return t.str>56?3:10;if(t.lg===4)return 1;return clamp(Math.round(19-t.str/5.5),1,15)}

// ===== Aufstellung & Stärke =====
function avail(p){return!p.inj&&!p.sus&&!p.nat}
function autoXI(t){const f=FORM[t.form],xi=[];POS.forEach((p,i)=>xi.push(...t.squad.filter(x=>x.pos===p&&avail(x)).sort((a,b)=>eff(b)-eff(a)).slice(0,f[i])));return xi}
function lineup(t){if(t.id===G.me&&G.xi){const xi=G.xi.map(id=>t.squad.find(p=>p.id===id)).filter(p=>p&&avail(p));if(xi.length===11&&xi.filter(p=>p.pos==="TW").length===1)return xi}return autoXI(t)}
function eff(p){return p.st*(0.85+p.form*0.03)*(0.6+p.fit*0.004)*(0.94+p.mor*0.01)}
function power(t){const xi=lineup(t);if(!xi.length)return 30;let s=xi.reduce((a,p)=>a+eff(p),0)/11;
 if(t.id===G.me){s*=1+(G.trainer.skill-50)/500+CAMPS[G.camp][1];const c=t.squad.find(p=>p.id===t.cap);if(c&&xi.includes(c))s*=c.char==="Führungsspieler"?1.03:1.01}
 else s*=DIFF[S().diff].ai;return s}

// ===== Spiel =====
function sim(H,A,o={}){const ph=power(H)*(o.neutral?1:1.05),pa=power(A);
 const st={offensiv:[1.25,1.2],normal:[1,1],defensiv:[0.8,0.75],konter:[0.95,0.85]},pr={niedrig:[0.92,0],mittel:[1,4],hoch:[1.1,9]},hd={fair:[1,.6],normal:[.97,1],hart:[.9,1.7]};
 const sideMods=X=>{const [a,d]=st[X.style||"normal"];const [pa_,pf]=pr[X.press||"mittel"];const [hdef,hc]=hd[X.hard||"normal"];return{att:a*pa_,def:d*(X.offside?0.9:1),opp:hdef,cards:hc,fit:pf,off:X.offside}};
 const mh=sideMods(H),ma=sideMods(A);let sh=0,sa=0,ev=[];const w=o.weather||"Sonne",wm=w==="Regen"?0.95:w==="Schnee"?0.9:1;
 const scorer=X=>pick(lineup(X).filter(p=>p.pos!=="TW"))||X.squad[0];
 const goal=(X,m,pen)=>{const p=pen?(X.squad.find(q=>q.id===X.pen&&avail(q))||scorer(X)):scorer(X);p.goals++;return p};
 for(let m=1;m<=90;m++){const r=Math.random(),ph_=0.028*mh.att*ph/pa*ma.def*ma.opp*wm,pa_=0.024*ma.att*pa/ph*mh.def*mh.opp*wm;
  if(r<ph_){sh++;ev.push(m+"' ⚽ TOR für "+H.name+"! "+goal(H,m).name+" ("+sh+":"+sa+")")}
  else if(r<ph_+pa_){sa++;ev.push(m+"' ⚽ TOR für "+A.name+"! "+goal(A,m).name+" ("+sh+":"+sa+")")}
  else if(r<ph_+pa_+0.003){const X=Math.random()<.5?H:A,p=X.squad.find(q=>q.id===X.pen&&avail(q))||scorer(X);ev.push(m+"' Elfmeter für "+X.name+"! "+p.name+" tritt an…");
   if(Math.random()<0.6+p.st/400){p.goals++;X===H?sh++:sa++;ev.push("… und verwandelt! ("+sh+":"+sa+")")}else ev.push("… gehalten!")}
  else if(r<ph_+pa_+0.005&&(mh.off||ma.off)){const X=mh.off?H:A;ev.push(m+"' Abseitsfalle von "+X.name+" greift nicht – Chance für den Gegner!");if(Math.random()<.35){X===H?sa++:sh++;ev.push("Tor! ("+sh+":"+sa+")")}}
  else if(r>1-0.015*((mh.cards+ma.cards)/2)){const X=Math.random()<.5?H:A,p=pick(lineup(X));if(!p)continue;const c=Math.random();
   if(c<.72){p.yel++;ev.push(m+"' 🟨 Gelb: "+p.name+" ("+X.name+")");if(p.yel>=5){p.sus=1;p.yel=0;ev.push(p.name+" ist für das nächste Spiel gesperrt")}}
   else if(c<.82){p.sus=rnd(1,3);ev.push(m+"' 🟥 ROT! "+p.name+" ("+X.name+"), "+p.sus+" Spiele Sperre")}
   else if(Math.random()<S().inj){p.inj=rnd(1,6);ev.push(m+"' ✚ Verletzung: "+p.name+" fällt "+p.inj+" Wochen aus")}}
  if(m===45)ev.push("Halbzeit: "+sh+":"+sa)}
 if(o.ko&&sh===sa){ev.push("Elfmeterschießen!");const pw=ph/(ph+pa);let a=0,b=0;for(let k=0;k<5||a===b;k++){if(Math.random()<.75+(pw-.5)*.2)a++;if(Math.random()<.75-(pw-.5)*.2)b++;if(k>20)break}
  ev.push("Elfmeterschießen: "+a+":"+b);a>b?sh++:sa++}
 [H,A].forEach(X=>{const xi=lineup(X),mm=sideMods(X);xi.forEach(p=>{p.games++;p.benched=0;p.fit=Math.max(45,p.fit-rnd(5,12)-mm.fit)});X.squad.filter(p=>!xi.includes(p)).forEach(p=>p.benched++)});
 if(o.league){H.gf+=sh;H.ga+=sa;A.gf+=sa;A.ga+=sh;if(sh>sa){H.w++;H.pts+=3;A.l++}else if(sh<sa){A.w++;A.pts+=3;H.l++}else{H.d++;A.d++;H.pts++;A.pts++}}
 const pos=clamp(Math.round(50+(ph-pa)/(ph+pa)*160+rnd(-4,4)),28,72),stats={pos,sh:[sh*rnd(2,3)+rnd(3,7),sa*rnd(2,3)+rnd(3,7)],co:[rnd(1,5)+Math.round(pos/15),rnd(1,5)+Math.round((100-pos)/15)]};
 return{h:H.id,g:A.id,hn:H.name,gn:A.name,sh,sa,ev,weather:w,stats}}
function gate(mult,w){const t=my(),X=G.stad;let d=t.fans*(G.fansMood/60)*(30/t.price)*mult*1.8;if((w==="Regen"||w==="Schnee")&&!X.roof)d*=.85;if(X.park)d*=1.05;if(X.light)d*=1.05;
 const z=Math.min(t.stadium,Math.round(d)),inc=(z*t.price+(X.vip?120000:0))*DIFF[S().diff].money;t.money+=inc;G.lastGate=z;book("Zuschauereinnahmen",inc);return z}
function book(k,v){G.log.push([k,Math.round(v)]);G.log=G.log.slice(-120)}

// ===== Spieltag =====
function playDay(){if(G.md>=34)return endSeason();const t=my();G.weather=S().weather?pick(["Sonne","Sonne","Sonne","Regen","Regen",G.md<6||G.md>28?"Sonne":"Schnee"]):"Sonne";
 const res={};let mine=null;
 [1,2,3].forEach(l=>{if(l>1&&!S().liga2&&t.lg!==l)return;res[l]=[];rounds(l,G.md).forEach(rd=>G.fix[l][rd].forEach(([h,g])=>{let w=G.weather;
  if(w==="Schnee"&&h===G.me&&!G.stad.heat&&Math.random()<.4){news("Spielausfall wegen Schnee! Das Spiel wird mit 0:0 gewertet – nächstes Mal hilft eine Rasenheizung.");w="Sonne"}
  const r=sim(T(h),T(g),{league:true,weather:w});res[l].push(r);if(h===G.me||g===G.me)mine=r;if(h===G.me)r.gate=gate(1,w)}))});
 const extra=[];if(S().cup&&G.cup&&CUPMD.includes(G.md))extra.push(cupRound());extra.push(...superCups(),...intlWeek());
 if(mine){const won=(mine.h===G.me&&mine.sh>mine.sa)||(mine.g===G.me&&mine.sa>mine.sh),lost=(mine.h===G.me&&mine.sh<mine.sa)||(mine.g===G.me&&mine.sa<mine.sh);
  G.board=clamp(G.board+(won?3:lost?-4:0),0,100);G.fansMood=clamp(G.fansMood+(won?4:lost?-4:0),10,100);G.mgr.rep=clamp(G.mgr.rep+(won?1:lost?-1:0),0,100);
  if(mine.h===G.me&&lost&&S().riots&&G.fansMood<35&&Math.random()<.15){const f=rnd(50,250)*1000;t.money-=f;book("DFB-Strafe (Ausschreitungen)",-f);news("Ausschreitungen nach der Niederlage! Der DFB verhängt "+eur(f)+" Strafe.")}}
 weekly();G.md++;G.last={res,mine,extra};
 if(G.md===WINTER)winterBreak();if(S().press&&Math.random()<.25)press();playerEvents();nationalTeam();
 if(G.board<15)return fired();
 if(G.md%4===0)genMarket();if(S().transfers)aiTransfers();go("spieltag",true)}
function cupRound(){G.cupRound++;const opp=pick(G.teams.filter(x=>x.id!==G.me));const home=Math.random()<.5;const r=home?sim(my(),opp,{ko:true}):sim(opp,my(),{ko:true});
 const mg=home?r.sh:r.sa,og=home?r.sa:r.sh,win=mg>og;if(home)gate(1.3,G.weather);const names=["1. Runde","2. Runde","Achtelfinale","Viertelfinale/Halbfinale","Finale in Berlin"];
 news("DFB-Pokal "+names[G.cupRound-1]+": "+r.hn+" – "+r.gn+" "+r.sh+":"+r.sa+(win?" – weiter!":" – ausgeschieden."));
 if(win){const p=400000*G.cupRound;my().money+=p;book("DFB-Pokal-Prämie",p);if(G.cupRound===5){G.cupWinner=G.me;news("🏆 DFB-POKALSIEGER!");G.history.push(G.season+": DFB-Pokalsieger");G.board+=20;G.mgr.rep+=8;G.cup=false}}else G.cup=false;
 r.title="DFB-Pokal · "+names[G.cupRound-1];return r}
function weekly(){const t=my(),m=DIFF[S().diff].money;const wages=t.squad.reduce((a,p)=>a+p.wage,0)/4+G.trainer.wage/4;t.money-=wages;book("Gehälter",-wages);
 if(G.sponsor){t.money+=G.sponsor.pay*m/34;book("Trikotsponsor",G.sponsor.pay*m/34)}
 G.banners.forEach(b=>{t.money+=b.pay*m/34});if(G.banners.length)book("Werbebanden",G.banners.reduce((a,b)=>a+b.pay,0)*m/34);
 const tv=({1:250000+(18-rank(G.me))*20000,2:90000,3:30000,4:5000}[t.lg])*m;t.money+=tv;book("TV-Gelder",tv);
 const merch=G.merch*t.fans*G.fansMood/30*m;t.money+=merch;book("Fanartikel",merch);
 if(CAMPS[G.camp][0]){t.money-=CAMPS[G.camp][0];book("Trainingslager",-CAMPS[G.camp][0])}
 G.loans.forEach(l=>{const i=l.amt*0.08/34;t.money-=i;book("Kreditzinsen",-i)});
 if(t.money>0){const i=t.money*0.02/34;t.money+=i;book("Guthabenzinsen",i)}
 if(G.build){G.build.left--;if(!G.build.left){t.stadium+=G.build.seats;news("Stadionausbau fertig: jetzt "+t.stadium.toLocaleString("de-DE")+" Plätze");G.build=null}}
 G.moneyHist.push(Math.round(t.money));G.moneyHist=G.moneyHist.slice(-102);G.posHist.push(rank(G.me));
 if(t.money<-5000000){G.board-=6;news("Der Vorstand ist über die Schulden alarmiert!")}
 G.teams.forEach(x=>x.squad.forEach(p=>{if(p.inj)p.inj--;if(p.sus)p.sus--;
  const me=x.id===G.me,tr=me?G.training:"Ausgewogen";p.fit=Math.min(100,p.fit+(tr==="Kondition"?25:15));
  let mod=me?({"Ausgewogen":1,"Technik":1.4,"Kondition":0.6,"Taktik":1.1,"Locker":0.4,"Standards":0.9}[tr])*(G.trainer.skill/60):1;if(p.char==="Talent")mod*=1.4;if(p.char==="Faulpelz")mod*=.5;
  if(p.age<29&&p.st<p.pot&&Math.random()<0.035*mod*(p.st>85?.5:1))p.st++;if(p.age>31&&Math.random()<0.05)p.st--;
  p.form=clamp(p.form+rnd(-1,1)+(me&&tr==="Locker"?1:0)+(p.char==="Launisch"?rnd(-1,1):0),1,10);
  if(me){if(p.benched>3&&p.st>65)p.mor=clamp(p.mor-1,1,10);else if(p.benched===0)p.mor=clamp(p.mor+(Math.random()<.3?1:0),1,10)}}))}
function rounds(l,md){const n=G.fix[l].length,a=Math.floor(md*n/34),b=Math.floor((md+1)*n/34),r=[];for(let k=a;k<b;k++)r.push(k);return r}
function rank(id){const t=T(id);return table(t.lg).findIndex(x=>x.id===id)+1}
function table(lg){return G.teams.filter(t=>t.lg===lg).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}

 ["Reporter: Stimmt es, dass Sie Ihren Star verkaufen wollen?",[["„Kein Kommentar.“",()=>{}],["„Niemand ist unverkäuflich.“",()=>{my().squad.forEach(p=>{if(p.st>75)p.mor=clamp(p.mor-2,1,10)});my().money+=0}],["„Er bleibt hier, Punkt.“",()=>{G.fansMood+=4}]]],
 ["Der Kicker will wissen: Was halten Sie vom Schiedsrichter am Wochenende?",[["„Eine Frechheit!“",()=>{const f=25000;my().money-=f;book("DFB-Strafe (Schiedsrichterkritik)",-f);G.fansMood+=3}],["„Kein Thema für mich.“",()=>{G.board+=1}]]],
 ["Sport-Talk im TV: Geben Sie ein Interview gegen Honorar?",[["„Gerne!“ (+30.000 DM)",()=>{my().money+=30000;book("TV-Interview",30000)}],["„Ich konzentriere mich aufs Training.“",()=>{my().squad.forEach(p=>p.form=clamp(p.form+1,1,10))}]]]];
 const [q,a]=pick(qs);ask("<b>Pressekonferenz</b><br>"+q,a.map(([l,f])=>[l,()=>{f();G.board=clamp(G.board,0,100);G.fansMood=clamp(G.fansMood,10,100);go(cur)}]))}
function playerEvents(){const t=my();t.squad.filter(p=>p.mor<=2&&!p.wantOut).slice(0,1).forEach(p=>{p.wantOut=true;
 ask("<b>"+esc(p.name)+"</b> ist unzufrieden (Moral "+p.mor+") und bittet um seine Freigabe.",[["Auf die Transferliste",()=>{sell(p.id)}],["Gespräch führen (+3 Moral)",()=>{p.mor+=3;p.wantOut=false;if(p.char==="Launisch"&&Math.random()<.5){p.mor-=2;news(esc(p.name)+" bleibt beleidigt.")}}],["Ignorieren",()=>{t.squad.forEach(x=>{if(x!==p)x.mor=clamp(x.mor-(Math.random()<.2?1:0),1,10)})}]])});
 if(Math.random()<.05){const p=pick(t.squad);const ev=pick([[" wurde nachts in der Disco erwischt. Geldstrafe?",()=>{p.mor-=1;t.money+=20000;book("Vereinsstrafe "+p.name,20000)},()=>{G.board-=2}],[" hat Heimweh und möchte zurück in seine Heimat.",()=>{p.mor+=2},()=>{p.mor-=2}]]);
  ask(esc(p.name)+ev[0],[["Hart durchgreifen",()=>{ev[1]();p.mor=clamp(p.mor,1,10)}],["Nachsicht zeigen",()=>{ev[2]();p.mor=clamp(p.mor,1,10)}]])}}
function nationalTeam(){const t=my();t.squad.forEach(p=>p.nat=false);if([8,16,24].includes(G.md)){const n=t.squad.filter(p=>p.st>=82&&!p.inj);n.forEach(p=>p.nat=true);if(n.length)news("Länderspielpause: "+n.map(p=>esc(p.name)).join(", ")+" für die Nationalmannschaft abgestellt (fehlen am Spieltag).")}}
function winterBreak(){const t=my(),opps=[pick(EUROPA),pick(LIGA2)];
 ask("<b>Winterpause!</b><br>Freundschaftsspiel und Hallenturnier bringen Geld. Was machen wir?",[
  ["Freundschaftsspiel gegen "+opps[0][0]+" (+"+eur(600000)+")",()=>{t.money+=600000;book("Freundschaftsspiel",600000);t.squad.forEach(p=>p.fit=clamp(p.fit-10,45,100))}],
  ["Hallenturnier (+"+eur(200000)+")",()=>{t.money+=200000;book("Hallenturnier",200000)}],
  ["Ruhe gönnen (Fitness +, Moral +)",()=>{t.squad.forEach(p=>{p.fit=100;p.mor=clamp(p.mor+1,1,10)})}]]);
 news("Winterpause – Zeit für Transfers und Trainingslager.")}
function fired(){G.mgr.career.push(G.season+": entlassen bei "+my().name);G.history.push(G.season+": Entlassung bei "+my().name);
 const offers=S().jobs?G.teams.filter(t=>t.id!==G.me&&t.lg<4&&t.str<my().str+2).sort(()=>Math.random()-.5).slice(0,G.mgr.rep>25?3:1):[];
 if(!offers.length)return say("Der Vorstand hat dich entlassen – kein Verein will dich. Game over.",newGame);
 ask("<b>Entlassen!</b> Der Vorstand hat die Geduld verloren.<br>Folgende Vereine bieten dir einen Job an:",offers.map(o=>[o.name+(o.lg>1?" ("+LN[o.lg]+")":""),()=>takeJob(o.id)]).concat([["Aufhören (neues Spiel)",newGame]]))}

 G.mgr.career.push(G.season+": Wechsel zu "+my().name);news("Neuer Job: Du bist jetzt Manager von "+esc(my().name)+".");offerSponsors();offerBanners();go("büro")}
function jobOffers(){if(!S().jobs||G.mgr.rep<45)return;const better=G.teams.filter(t=>t.id!==G.me&&t.lg<4&&t.str>my().str&&t.str<=my().str+12+G.mgr.rep/10).sort(()=>Math.random()-.5).slice(0,2);
 if(better.length&&Math.random()<.6)ask("<b>Jobangebot!</b> Dein Ruf ("+G.mgr.rep+") hat sich herumgesprochen.",better.map(o=>["Wechseln zu "+o.name+(o.lg>1?" ("+LN[o.lg]+")":""),()=>takeJob(o.id)]).concat([["Bleiben",()=>{G.board+=5}]]))}

function endSeason(){const t=my(),r=rank(G.me),lg=t.lg;let msg="<b>Saison "+G.season+"/"+String(G.season+1).slice(2)+" beendet</b> – "+LN[lg]+", Platz "+r+".";
 if(lg===1&&r===1){msg+="<br>🏆 DEUTSCHER MEISTER!";G.history.push(G.season+": Deutscher Meister");t.money+=8000000;G.mgr.rep+=15}
 else G.history.push(G.season+": "+LN[lg]+" Platz "+r);
 G.mgr.career.push(G.season+": "+t.name+", "+LN[lg]+" Platz "+r);
 const diff=aim()-r;G.board=clamp(G.board+diff*4,0,100);G.mgr.rep=clamp(G.mgr.rep+diff*2,0,100);
 const t1=table(1),t2=table(2);if(G.cupWinner==null){const c=t1.slice(0,10).filter(x=>x.id!==G.me);G.cupWinner=c[Math.min(c.length-1,Math.floor(Math.random()*Math.random()*c.length))].id;news("DFB-Pokalsieger: "+esc(T(G.cupWinner).name))}
 G.dflSuper=[t1[0].id,G.cupWinner===t1[0].id?t1[1].id:G.cupWinner];qualify();G.uefaSuper=G.won.includes("CL")||G.won.includes("EL");G.cwc=G.won.includes("CL");G.won=[];
 const moves=[];if(S().liga2){const up2=table(2).slice(0,3),down1=t1.slice(15),elig3=table(3).filter(x=>!/ II$/.test(x.name)),up3=elig3.slice(0,3),down2=table(2).slice(15),down3=table(3).slice(16),regio=G.teams.filter(x=>x.lg===4).sort(()=>Math.random()-.5).slice(0,4);
  down1.forEach(x=>moves.push([x,2]));up2.forEach(x=>moves.push([x,1]));down2.forEach(x=>moves.push([x,3]));up3.forEach(x=>moves.push([x,2]));down3.forEach(x=>moves.push([x,4]));regio.forEach(x=>moves.push([x,3]));
  moves.forEach(([x,l])=>{if(x===t){if(l<x.lg){msg+="<br>🎉 AUFSTIEG in die "+LN[l]+"!";G.board+=20;G.history.push(G.season+": Aufstieg in die "+LN[l]);G.mgr.rep+=8}else{msg+="<br>Abstieg in die "+LN[l]+"!";G.board-=20}}x.lg=l});
  if(my().lg===4){msg+="<br>In der Regionalliga ist für dich Schluss.";G.board=0}}
 else if(r>=16){msg+="<br>Abstiegsplatz – der Vorstand zieht Konsequenzen.";G.board=0}
 say(msg,()=>{if(G.board<15)return fired();nextSeason();jobOffers()})}
function nextSeason(){const t=my();G.season++;G.md=0;G.cupRound=0;G.cup=true;G.cupWinner=null;G.posHist=[];G.camp="Kein";G.xi=null;
 G.loans.forEach(l=>l.left--);G.teams.forEach(x=>{Object.assign(x,{pts:0,gf:0,ga:0,w:0,d:0,l:0});x.squad.forEach(p=>{p.age++;p.goals=0;p.games=0;p.yel=0;p.contract--;p.value=val(p);p.wantOut=false});
  x.squad=x.squad.filter(p=>{if(p.age>35){if(x.id===G.me)news(esc(p.name)+" beendet seine Karriere.");return false}
   if(p.contract<=0){if(x.id===G.me){news("Vertrag von "+esc(p.name)+" ausgelaufen – er verlässt den Verein.");return false}p.contract=rnd(1,3)}return true});
  while(x.squad.length<20)x.squad.push(mkPlayer(pick(POS),x.str))});
 for(let i=0;i<G.youth+1;i++){const p=mkPlayer(pick(["AB","MF","ST"]),t.str+G.youth*2,true);p.pot=Math.min(92,p.pot+G.youth*3);p.value=val(p);t.squad.push(p);news("Jugendspieler "+esc(p.name)+" ("+p.pos+", Pot. "+p.pot+") rückt auf.")}
 if(G.sponsorYrs!==undefined){G.sponsorYrs--;if(G.sponsorYrs<=0)offerSponsors()}else offerSponsors();

function genMarket(){G.market=[];for(let i=0;i<16;i++){const src=pick(G.teams.filter(t=>t.id!==G.me));let p;
 if(Math.random()<.5&&src.squad.length>18){p=src.squad.splice(rnd(0,src.squad.length-1),1)[0];p.from=src.name}else{p=mkPlayer(pick(POS),rnd(50,88));p.from=Math.random()<.3?"Ausland":"vereinslos"}p.value=val(p);G.market.push(p)}}
function buy(id){const p=G.market.find(x=>x.id===id),t=my();if(!S().transfers)return say("Transfers sind in den Einstellungen deaktiviert.");
 num("Ablöse bieten für "+esc(p.name)+" (Marktwert "+eur(p.value)+"):",p.value,off=>{if(off>t.money+2000000)return say("Nicht genug Geld – die Bank spielt nicht mit.");
  if(off<p.value*(0.8+Math.random()*0.3))return say("Angebot abgelehnt. Der abgebende Verein will mehr.");
  num("Gehalt pro Monat anbieten (Forderung "+eur(p.wage)+"):",p.wage,w=>{if(w<p.wage*(p.char==="Profi"?0.95:0.85))return say(esc(p.name)+" lehnt ab.");
   ask("Vertragslaufzeit:",[1,2,3,4,5].map(y=>[y+" Jahre",()=>{t.money-=off;p.wage=w;p.contract=y;p.mor=8;t.squad.push(p);G.market=G.market.filter(x=>x!==p);book("Transfer "+p.name,-off);news(esc(p.name)+" wechselt für "+eur(off)+" zu uns!");go("transfer")}]))})})}
function sell(id){const t=my(),p=t.squad.find(x=>x.id===id);if(!p)return;if(t.squad.length<=16)return say("Kader zu klein (min. 16 Spieler).");
 const bid=Math.round(p.value*(0.7+Math.random()*0.5)*(p.wantOut?0.85:1)/1000)*1000,club=pick(G.teams.filter(x=>x.id!==G.me));

function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const CREST_COL=["#dc2626","#1d4ed8","#16a34a","#facc15","#0f172a","#f97316","#7c3aed","#0891b2","#be123c","#e5e7eb","#15803d","#1e3a8a"];
function crest(name,sz=22){const h=hash(name),a=CREST_COL[h%12],b=CREST_COL[(h>>4)%12===h%12?(h%12+5)%12:(h>>4)%12],pat=(h>>8)%4;
 const ini=name.replace(/^(1\.|FC|SV|SC|VfL|VfB|TSG|TSV|SG|SpVgg|FSV|RB|SSC|AS|AC|OSC|OGC|KRC|RSC|FK|IF|HJK)\s+/g,"").replace(/[^A-Za-zÄÖÜäöü ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"FC";
 const fill=pat===0?`<path d="M2 2h9v22L2 18z" fill="${b}"/>`:pat===1?`<path d="M2 10h20v4H2z" fill="${b}"/>`:pat===2?`<path d="M2 2l20 20v-6L8 2z" fill="${b}"/>`:`<circle cx="12" cy="12" r="6" fill="${b}"/>`;
 return`<svg class=crest width="${sz}" height="${sz*1.15}" viewBox="0 0 24 28" aria-hidden="true"><clipPath id="c${h}"><path d="M2 2h20v12c0 7-5 10-10 13C7 24 2 21 2 14z"/></clipPath><g clip-path="url(#c${h})"><rect width="24" height="28" fill="${a}"/>${fill}</g><path d="M2 2h20v12c0 7-5 10-10 13C7 24 2 21 2 14z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><text x="12" y="16.5" text-anchor="middle" font-size="${ini.length>1?8:10}" font-weight="800" fill="#fff" stroke="#000" stroke-width=".6" paint-order="stroke" font-family="system-ui,sans-serif">${ini}</text></svg>`}
const cn=(name,sz)=>`<span class=cn>${crest(name,sz)}<span>${esc(name)}</span></span>`;
function pitchSVG(t,xi){const f=FORM[t.form],rows=[];let k=0;POS.forEach((p,i)=>{rows.push(xi.filter(x=>x.pos===p).slice(0,f[i]))});

 <div class=box><h2>Ausbauten</h2>${Object.entries(STADX).map(([k,[n,c,d]])=>`<div class=xrow><div><b>${n}</b><br><span class=dim>${d}</span></div>${G.stad[k]?'<span class=ok>✓ vorhanden</span>':`<button class=btn onclick="buyX('${k}')">${eur(c)}</button>`}</div>`).join("")}</div>
 <div class=box><h2>Fanshop & Jugend</h2>Fanshop Stufe ${G.merch}${bar(G.merch*20,"var(--acc2)")}<button class=btn onclick="upg('merch',1500000)">Fanshop ausbauen (${eur(1500000)})</button><br><br>Jugendinternat Stufe ${G.youth}${bar(G.youth*20,"var(--acc)")}<button class=btn onclick="upg('youth',2000000)">Internat ausbauen (${eur(2000000)})</button></div></div>`},
"verein":()=>`<div class=box><h2>Alle Vereine</h2><div class=scroll><table><tr><th>Verein</th><th>Liga</th><th>Stärke</th><th>Formation</th><th>Stadion</th><th>Kader</th></tr>${G.teams.slice().sort((a,b)=>a.lg-b.lg||power(b)-power(a)).map(t=>`<tr class="${t.id===G.me?"me":""}"><td>${cn(t.name,18)}</td><td>${LN[t.lg]}</td><td><div class=sbar><i style="width:${power(t)}%"></i><span>${power(t).toFixed(1)}</span></div></td><td>${t.form}</td><td>${t.stadium.toLocaleString("de-DE")}</td><td>${t.squad.length}</td></tr>`).join("")}</table></div></div>`,
"statistik":()=>{const all=G.teams.filter(t=>t.lg===my().lg).flatMap(t=>t.squad.map(p=>({...p,club:t.name})));const tg=all.slice().sort((a,b)=>b.goals-a.goals).slice(0,15),mg=Math.max(1,tg[0]?tg[0].goals:1);
 return`<div class=grid><div class=box><h2>Torjägerliste ${LN[my().lg]}</h2>${tg.map((p,i)=>`<div class=fin><span>${i+1}. ${esc(p.name)} <span class=dim>${esc(p.club)}</span></span><div class=fbar><i style="width:${p.goals/mg*100}%"></i></div><b>${p.goals}</b></div>`).join("")}</div>
 <div class=box><h2>Beste Spieler</h2><table>${all.slice().sort((a,b)=>b.st-a.st).slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${cn(p.club,16)}</td><td><b>${p.st}</b></td></tr>`).join("")}</table></div></div>`}});
function nextMatchG(){if(G.md>=34)return"Saison beendet – drück auf „Saison beenden“.";const rr=rounds(my().lg,G.md),m=G.fix[my().lg][rr[rr.length-1]].find(x=>x.includes(G.me));
 let s=`<div class="board small"><div class=side>${crest(T(m[0]).name,36)}<b>${esc(T(m[0]).name)}</b></div><div class=sc><i>vs</i></div><div class=side>${crest(T(m[1]).name,36)}<b>${esc(T(m[1]).name)}</b></div></div>`;
 const extra=[];if(S().cup&&G.cup&&CUPMD.includes(G.md))extra.push("DFB-Pokal");if(intlThisWeek())extra.push(COMP[G.intl.comp].n);if(G.md===0&&G.dflSuper&&G.dflSuper.includes(G.me))extra.push("DFL-Supercup");if(G.md===2&&G.uefaSuper)extra.push("UEFA Super Cup");if(G.md===WINTER&&G.cwc)extra.push("FIFA Klub-WM");
 return s+(extra.length?`<p class=dim style="text-align:center">+ ${extra.join(" · ")} diese Woche</p>`:"")}

function toggleXI(id,on){let xi=G.xi||lineup(my()).map(p=>p.id);xi=xi.filter(x=>x!==id);if(on)xi.push(id);G.xi=xi;go("taktik")}
try{G=JSON.parse(localStorage.getItem("fmretro2627"));if(G&&!G.set)G=null}catch(e){G=null}
if(G){G.set=Object.assign({},DEFAULTS,G.set);go("büro")}else{G={set:Object.assign({},DEFAULTS)};newGame()}
</script>
